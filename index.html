function save(){try{const snap={...S,stock:[...S.stock]};for(const c of customers)if(c.state!=='leave')for(const id of c.cart)snap.stock[id]++;localStorage.setItem('pokermart-v1',JSON.stringify(snap));return true;}catch{toast('Speicherung fehlgeschlagen. Bitte exportiere deinen Spielstand.');return false;}}

// WELT: begehbare Räume, Kollisionsprüfung und Pfadsuche.
function floor(x,y,state=S){const l=STAGES[state.expanded];return inRect(x,y,l.shop)||inRect(x,y,l.store)||(y===l.door&&x===l.shop[2]+1)||(y>=14&&y<=16&&x>=3&&x<=24);}
// Sichtbare Wandgrenzen stimmen mit Kollision und Pfadsuche überein.
function canCross(x,y,nx,ny,state=S){if(x===nx&&y===ny)return true;const l=STAGES[state.expanded],area=(a,b)=>inRect(a,b,l.shop)?'shop':inRect(a,b,l.store)?'store':a===l.shop[2]+1&&b===l.door?'hall':'outside',from=area(x,y),to=area(nx,ny);if(from===to)return true;if(from==='hall'||to==='hall')return from!=='outside'&&to!=='outside';if((from==='shop'&&to==='outside')||(from==='outside'&&to==='shop'))return y!==ny&&(x===12||x===13)&&x===nx&&Math.min(y,ny)===13;return false;}
function wallFixture(kind){return !!FURN[kind]?.type||kind==='deposit';}
function checkoutVector(f){return [[1,0],[0,1],[-1,0],[0,-1]][f.rot||0];}
function furnitureCells(f){if(f.kind!=='checkout')return[{x:f.x,y:f.y}];const [dx,dy]=checkoutVector(f);return[-1,0].map(i=>({x:f.x+dx*i,y:f.y+dy*i}));}
function checkoutFacing(f){const [dx,dy]=checkoutVector(f);return{x:-dy,y:dx};}
function cashierCell(f){const n=checkoutFacing(f);return{x:f.x+n.x,y:f.y+n.y};}
function customerCells(f){const n=checkoutFacing(f);return [[f.x-n.x,f.y-n.y]];}
function furnitureDistance(p,f){return Math.min(...furnitureCells(f).map(c=>distance(p,c)));}
function furnitureBounds(f,state=S){const cells=furnitureCells(f),top=STAGES[state.expanded].shop[1],wall=wallFixture(f.kind)&&f.y<=top+1;return{left:Math.min(...cells.map(p=>p.x))-.065,right:Math.max(...cells.map(p=>p.x))+1.065,top:wall?top:Math.min(...cells.map(p=>p.y))+.08,bottom:Math.max(...cells.map(p=>p.y))+.93};}
function repairCheckoutLayout(state){const b=STAGES[state.expanded].shop;for(const f of state.furniture){if(f.kind!=='checkout')continue;if(f.rot!==undefined&&(!Number.isInteger(f.rot)||f.rot<0||f.rot>3))throw Error('Ungültige Kassenausrichtung');if(state.checkoutLayout===1||state.checkoutLayout===2){f.rot=f.rot||0;continue;}const options=[];for(let y=b[1];y<=b[3];y++)for(let x=b[0];x<=b[2];x++)for(let rot=0;rot<4;rot++){const c={...f,x,y,rot},cells=furnitureCells(c),staff=cashierCell(c);if(!cells.every(p=>inRect(p.x,p.y,b))||!inRect(staff.x,staff.y,b)||!customerCells(c).some(([x,y])=>inRect(x,y,b)))continue;if(cells.some(p=>state.furniture.some(k=>k!==f&&furnitureCells(k).some(t=>p.x===t.x&&p.y===t.y))))continue;if(state.furniture.some(k=>k!==f&&furnitureCells(k).some(t=>t.x===staff.x&&t.y===staff.y)))continue;options.push({...c,score:distance(c,f)+(rot===0?0:.1)});}options.sort((a,b)=>a.score-b.score);if(!options.length)throw Error('Kein Platz für die zweiteilige Kasse');Object.assign(f,{x:options[0].x,y:options[0].y,rot:options[0].rot});}state.checkoutLayout=2;return state;}
// Die Figur kollidiert über ihre Füße, nicht über das gerundete Feld des Sprite-Ursprungs.
function baseFootBlocked(x,y,state=S){const cx=x+.5,cy=y+.70,rx=.27,ry=.16,gx=Math.floor(cx),gy=Math.floor(cy);for(const [dx,dy]of [[0,0],[-rx,-ry],[rx,-ry],[-rx,ry],[rx,ry]]){const tx=Math.floor(cx+dx),ty=Math.floor(cy+dy);if(!floor(tx,ty,state)||!canCross(gx,gy,tx,ty,state))return true;}for(const f of state.furniture){const b=furnitureBounds(f,state);if(cx+rx>b.left&&cx-rx<b.right&&cy+ry>b.top&&cy-ry<b.bottom)return true;}return false;}
function canMove(fromX,fromY,x,y){return !footBlocked(x,y)&&canCross(Math.floor(fromX+.5),Math.floor(fromY+.7),Math.floor(x+.5),Math.floor(y+.7));}
function solid(x,y){return footBlocked(x,y);}
function repairCabinetLayout(state){const top=STAGES[state.expanded].shop[1];if(state.wallLayout!==2){for(const f of state.furniture){if(wallFixture(f.kind)&&f.y===top+1&&!state.furniture.some(k=>k!==f&&k.x===f.x&&k.y===top))f.y=top;}state.wallLayout=2;}if(footBlocked(state.player.x,state.player.y,state)){const candidates=[];for(let y=3;y<=16;y++)for(let x=3;x<=24;x++)if(!footBlocked(x,y,state))candidates.push({x,y});candidates.sort((a,b)=>distance(a,state.player)-distance(b,state.player));if(candidates.length)state.player=candidates[0];}return state;}

function path(sx,sy,tx,ty){const startX=sx,startY=sy;sx=Math.round(sx);sy=Math.round(sy);tx=Math.round(tx);ty=Math.round(ty);let q=[[sx,sy]],seen=new Set([sx+','+sy]),prev=new Map();for(let k=0;k<q.length;k++){const [x,y]=q[k];if(x===tx&&y===ty){let p=[],cur=[x,y];while(cur[0]!==sx||cur[1]!==sy){p.unshift(cur);cur=prev.get(cur.join(','));if(!cur)return [];}if(Math.hypot(startX-sx,startY-sy)>.001)p.unshift([sx,sy]);return p;}for(const [dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy,key=nx+','+ny;if(!seen.has(key)&&!solid(nx,ny)&&canCross(x,y,nx,ny)){seen.add(key);prev.set(key,[x,y]);q.push([nx,ny]);}}}return [];}
function neighbors(f){return (f.kind==='checkout'?customerCells(f):[[f.x,f.y+1],[f.x-1,f.y],[f.x+1,f.y],[f.x,f.y-1]]).filter(([x,y])=>!solid(x,y));}
function route(c,f){for(const [x,y] of neighbors(f)){const p=path(c.x,c.y,x,y);if(p.length||Math.hypot(c.x-x,c.y-y)<.4){c.path=p;c.target=f;return true;}}return false;}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function baseLeave(c,happy,requeue=true){const till=c.state==='queue'?c.target:null;c.state='leave';c.path=path(c.x,c.y,12,16);c.target=null;S.rating=Math.max(10,Math.min(100,S.rating+(happy?.5:-1.8)));if(!happy)S.lost++;if(requeue&&till)refreshQueue(till);}
function basePurchase(c){if(c.state!=='queue')return;act(c,'sell',c.target);const clerk=c.target?.kind==='self'?null:S.staff.cashier?staffActor('cashier',c.target):S.player;if(clerk)act(clerk,'sell',c.target);let v=c.cart.reduce((s,i)=>s+Math.round(S.prices[i]*100),0)/100;S.money=Math.round((S.money+v)*100)/100;S.revenue=Math.round((S.revenue+v)*100)/100;S.sales+=c.cart.length;S.served++;record(c.profile+' kauft für '+money(v)+' ('+c.payment+').');toast(c.payment+' · '+money(v)+' kassiert');leave(c,true);save();}

function checkoutSide(f,staff=true){return(staff?['unten','links','oben','rechts']:['oben','rechts','unten','links'])[f.rot||0];}
function queueHead(f){return customers.find(c=>c.state==='queue'&&c.target===f);}
function queueSlots(f){if(f.kind!=='checkout')return neighbors(f);const b=layout().shop,[dx,dy]=checkoutVector(f),n=checkoutFacing(f),slots=[],head=customerCells(f)[0];if(!inRect(head[0],head[1],b)||solid(head[0],head[1])||!path(12,16,head[0],head[1]).length)return slots;for(let depth=0;depth<=5;depth++)for(const offset of [0,-1,1,-2,2,-3,3]){const x=head[0]-n.x*depth+dx*offset,y=head[1]-n.y*depth+dy*offset;if(!inRect(x,y,b)||solid(x,y)||!path(12,16,x,y).length)continue;slots.push([x,y]);}return slots;}
function refreshQueue(f){const line=customers.filter(c=>c.state==='queue'&&c.target===f),slots=queueSlots(f);line.forEach((c,i)=>{const target=slots[i];if(!target){leave(c,false,false);return;}const p=path(c.x,c.y,target[0],target[1]);if(!p.length&&Math.hypot(c.x-target[0],c.y-target[1])>.4){leave(c,false,false);return;}c.path=p;c.queueIndex=i;c.queueGoal={x:target[0],y:target[1]};c.think=0;if(!p.length)face(c,f);});}
function queue(c){const checkouts=S.furniture.filter(f=>f.kind==='checkout'||f.kind==='self').map(f=>({f,n:customers.filter(k=>k.state==='queue'&&k.target===f).length})).sort((a,b)=>a.n-b.n);for(const {f,n}of checkouts){const target=queueSlots(f)[n];if(!target)continue;const p=path(c.x,c.y,target[0],target[1]);if(!p.length&&Math.hypot(c.x-target[0],c.y-target[1])>.4)continue;c.state='queue';c.target=f;c.path=p;c.queueIndex=n;c.queueGoal={x:target[0],y:target[1]};c.bubble=c.payment==='Bar'?'Bar bitte':'Mit Karte';c.think=0;return;}leave(c,false);}
function readyCustomer(f){const c=queueHead(f);if(!c)return null;const target=neighbors(f)[0];if(target&&Math.hypot(c.x-target[0],c.y-target[1])<.45){c.path=[];return c;}return null;}
function openCheckoutControls(f){selection=f;currentPanel='checkoutControls';show('Kasse · Ausrichtung',`<p>Bedienseite: <b>${checkoutSide(f)}</b> · Kundenseite: <b>${checkoutSide(f,false)}</b></p><p class="sub">Der erste Kunde steht direkt vor dem Kassenfeld. Gehe zum Bedienplatz auf der gegenüberliegenden Seite. Zum seitlichen Aufstellen den gesamten Tresen drehen und die Vorschau mit A bestätigen.</p><button type="button" class="primary" onclick="requestCheckout()">Kassenmenü öffnen</button><p class="sub">${queueHead(f)?'Ein Kunde ist auf dem Weg oder bereit zur Zahlung.':'Noch kein Kunde an dieser Kasse. Öffne den Laden und warte auf einen Einkauf.'}</p><button onclick="beginMove(selection);rotatePreview()">↻ Gesamte Kasse 90° drehen</button><button onclick="beginMove(selection)">↔ Kasse verschieben</button>`);}

// SIMULATION: Kunden, Lieferketten, Personal, Kosten und Ereignisse.
function baseUpdate(dt){if(S.paused||editing()||($('modal').open&&currentPanel!=='checkoutWaiting'))return;if(pendingCheckout){if(!S.furniture.includes(pendingCheckout)||!playerAtCheckout(pendingCheckout))pendingCheckout=null;else if(readyCustomer(pendingCheckout)){const f=pendingCheckout;pendingCheckout=null;serveAtCheckout(f);return;}}S.time+=dt;spawn+=dt;auto+=dt;staffTick+=dt;for(const o of S.orders)o.eta-=dt;let arrived=S.orders.filter(o=>o.eta<=0);for(const o of arrived){S.crates.push({pid:o.pid,qty:o.qty,supplier:o.supplier});toast('Lieferung angekommen! Im Lager mit A / E annehmen.');}S.orders=S.orders.filter(o=>o.eta>0);
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if((dx||dy)&&!acting(S.player)){face(S.player,{x:S.player.x+dx,y:S.player.y+dy});let d=Math.hypot(dx,dy),nx=S.player.x+dx/d*dt*4,ny=S.player.y+dy/d*dt*4;if(canMove(S.player.x,S.player.y,nx,S.player.y))S.player.x=nx;if(canMove(S.player.x,S.player.y,S.player.x,ny))S.player.y=ny;}
if(S.open&&spawn>6/currentEvent().traffic&&customers.length<[5,9,14,18][S.expanded]){spawn=0;addCustomer();}
for(const c of customers){c.patience-=dt;if(c.state!=='leave'&&c.patience<=0){c.bubble='Zu lange!';leave(c,false);}if(c.path.length){if(acting(c))continue;let p=c.path[0],d=Math.hypot(p[0]-c.x,p[1]-c.y),step=dt*1.9;if(d<=step){c.x=p[0];c.y=p[1];c.path.shift();}else{c.x+=(p[0]-c.x)/d*step;c.y+=(p[1]-c.y)/d*step;}continue;}c.think+=dt;
if(c.state==='shop'&&c.think>1.2){c.think=0;let f=c.target;if(f&&f.qty>0){const p=PRODUCTS[f.pid],tolerance=1.55+(PROFILES.indexOf(c.profile)%7)*.18+(currentEvent().tolerance||0)+(f.tier||0)*.08+(S.career.loyalty[PROFILES.indexOf(c.profile)]||0)*.002;if(S.prices[p.id]/p.cost>tolerance){c.bubble='Zu teuer!';if(!c.cart.length){leave(c,false);continue;}}else if(Math.random()<S.trash.length*.025){c.bubble='Hier ist es schmutzig!';leave(c,false);continue;}else{f.qty--;c.cart.push(p.id);act(c,'take',f);c.bubble='✓ '+p.name.split(' ·')[0];}}
if(c.cart.length>=c.wants||Math.random()<.25){if(c.cart.length){if(c.thief){c.bubble='…';c.state='steal';c.path=path(c.x,c.y,12,16);}else queue(c);}else leave(c,false);}else{let a=S.furniture.filter(f=>FURN[f.kind].type&&f.qty>0);if(!a.length||!route(c,preferredFixture(c,a))){if(c.cart.length)queue(c);else leave(c,false);}}}
if(c.state==='queue'){let first=readyCustomer(c.target);if(first===c&&(c.target.kind==='self'||(S.staff.cashier&&!playerAtCheckout(c.target)&&pendingCheckout!==c.target))&&c.think>(c.target.kind==='self'?5/(1+.25*(c.target.tier||0)):3/(1+.3*(c.target.tier||0))))purchase(c);}
if(c.state==='steal'&&distance(c,{x:12,y:16})<.3){S.rating=Math.max(10,S.rating-1);S.lost++;toast('Diebstahl! Ware verloren. Sicherheit einstellen oder mit E ansprechen.');c.done=true;}
if(c.state==='leave'&&distance(c,{x:12,y:16})<.3){c.done=true;if(S.furniture.some(f=>f.kind==='deposit'))S.deposits+=1+Math.floor(Math.random()*3);if(Math.random()<.25)S.trash.push({x:layout().shop[0]+Math.floor(Math.random()*(layout().shop[2]-layout().shop[0]+1)),y:13});}}
customers=customers.filter(c=>!c.done);
if(staffTick>3){staffTick=0;if(S.staff.stocker){for(let i=0;i<S.staff.stocker;i++){if(S.crates.length){acceptCrate(staffActor('stocker'));}else{const f=S.furniture.find(f=>FURN[f.kind].type&&f.qty<furnitureCapacity(f)*2/3&&S.stock[f.pid]>0);if(f)refill(f,staffActor('stocker'));}}}if(S.staff.cleaner&&S.trash.length){act(staffActor('cleaner'),'clean',S.trash[0]);S.trash.splice(0,S.staff.cleaner);}if(S.staff.security){const c=customers.find(c=>c.state==='steal');if(c){act(staffActor('security'),'stop',c);c.thief=false;S.stopped++;queue(c);toast('Sicherheit hat einen Diebstahl verhindert.');}}}
if(S.time>=240){S.time-=240;S.day++;syncCareerDay();let wages=Object.values(S.staff).reduce((a,b)=>a+b,0)*85,utilities=[12,22,35,50][S.expanded]+S.furniture.filter(f=>['cold','frozen','self'].includes(f.kind)).reduce((sum,f)=>sum+5*(1-.15*(f.tier||0)),0);S.money-=wages+utilities;record('Tageskosten '+money(wages+utilities));toast('Tag '+S.day+' · Personal & Betrieb: '+money(wages+utilities));}
if(auto>12){auto=0;save();}hud();}
function broomPoint(){const b=layout().store;return{x:b[2],y:b[1]};}
function toggleBroom(){S.broomHeld=!S.broomHeld;pendingCheckout=null;const a=pose(S.player);a.action=null;a.until=animationTime;save();hud();toast(S.broomHeld?'Besen mitgenommen · E / A wischt Schmutz. Danach hier zurücklegen.':'Besen zurückgelegt · Kasse und Waren wieder bedienbar.');}
function baseSweepTrash(){if(!S.broomHeld){toast('Zum Aufwischen erst den Besen im Lager holen.');return;}if(S.paused){toast('Zum Aufwischen erst die Pause beenden.');return;}if(acting(S.player))return;const dirt=S.trash.map((t,i)=>({t,i,d:distance(S.player,t)})).filter(t=>t.d<1.8).sort((a,b)=>a.d-b.d)[0];if(!dirt){toast('Kein Schmutz in Reichweite · Besen im Lager zurücklegen.');return;}act(S.player,'clean',dirt.t);S.trash.splice(dirt.i,1);save();hud();toast('Schmutz aufgewischt · Besen anschließend im Lager zurücklegen.');}
function interact(){if($('modal').open)return;if(moveMode){toast('Möbelmodus aktiv · erst mit B beenden, dann kassieren.');return;}if(distance(S.player,broomPoint())<1.35){toggleBroom();return;}if(S.broomHeld){sweepTrash();return;}const serviceTill=S.furniture.find(f=>f.kind==='checkout'&&playerAtCheckout(f));if(serviceTill){const a=pose(S.player);a.action=null;a.until=animationTime;serveAtCheckout(serviceTill);return;}if(S.paused){toast('Spiel pausiert · am Fußsymbol kannst du trotzdem die Kasse öffnen.');return;}if(acting(S.player))return;let c=customers.find(c=>c.state==='steal'&&distance(S.player,c)<2);if(c){act(S.player,'stop',c);c.thief=false;S.stopped++;queue(c);toast('Angesprochen! Der Kunde geht zur Kasse.');return;}let dirt=S.trash.findIndex(t=>distance(S.player,t)<1.8);if(dirt>=0){toast('Zum Aufwischen den Besen im Lager holen.');return;}if(S.crates.length&&distance(S.player,storagePoint())<2.3){acceptCrate();return;}if(distance(S.player,storagePoint())<1.5){panel('storage');return;}const f=S.furniture.filter(f=>furnitureDistance(S.player,f)<2.05).sort((a,b)=>furnitureDistance(S.player,a)-furnitureDistance(S.player,b))[0];if(!f){toast('Nähere dich einem Möbel, einer Lieferung oder Schmutz.');return;}if(f.kind==='checkout'){if(!playerAtCheckout(f)){openCheckoutControls(f);return;}serveAtCheckout(f);}else if(FURN[f.kind].type){selection=f;shelfPanel(f);}else if(f.kind==='deposit'){const n=Math.min(10,S.deposits);if(!n){toast('Noch keine Pfandrückgaben. Kunden bringen Flaschen nach ihrem Einkauf zurück.');return;}act(S.player,'deposit',f);S.money+=n*.25;S.deposits-=n;toast('Pfandservice: '+money(n*.25)+' Bearbeitungsbonus.');f.used=S.time;}else if(f.kind==='bin'){if(S.trash.length)toast('Bodenschmutz mit dem Besen aus dem Lager aufwischen.');else toast('Alles sauber.');}else toast('Ein bisschen Grün macht den Laden gemütlicher.');}
const PAYMENT_COINS=[200,100,50,20,10,5,2,1];
function paymentNeedle(p=payment){const n=(p.clock*.65)%2;return n<=1?n:2-n;}
function checkoutPanel(c){if(!c||c.state!=='queue'||readyCustomer(c.target)!==c)return;selection=c;payment={customer:c,phase:c.payment==='Bar'?'cash':'card',clock:0,uiClock:0,target:.5,width:.22+.04*(c.target.tier||0),scanned:0,cardHits:0,totalCents:c.cart.reduce((sum,id)=>sum+Math.round(S.prices[id]*100),0),givenCents:0,counts:PAYMENT_COINS.map(()=>0),choice:0,cashMode:'keypad',cashStep:'change',cashEntry:'',padChoice:0,repeat:0,direction:'',cool:0,message:'Drücke A, wenn der Zeiger im grünen Bereich steht.'};currentPanel='payment';if(c.payment==='Bar')startCashPayment();else renderPayment();}
function startCashPayment(){const p=payment;if(!p||p.customer.payment!=='Bar'||p.customer.state!=='queue'||readyCustomer(p.customer.target)!==p.customer)return;p.phase='cash';p.scanned=p.customer.cart.length;p.givenCents=Math.ceil((p.totalCents+1)/500)*500;p.cool=0;p.cashMode='keypad';p.cashStep='change';p.cashEntry='';p.padChoice=0;p.message='Nur den Wechselbetrag eingeben und Auszahlen drücken.';renderPayment();}
function renderPayment(){const p=payment;if(!p)return;currentPanel='payment';const c=p.customer,amount=money(p.totalCents/100);let content=`<div class="payment-summary"><span>${c.payment==='Bar'?'Bargeld':'EC-Karte'} · ${c.cart.length} Artikel</span><b>${amount}</b></div>`;if(p.phase==='card'){content+=`<div class="payment-game"><span class="game-step">KARTENZAHLUNG</span><h3>Gesamten Einkauf bezahlen</h3><p>${c.cart.length} Artikel · ein Treffer für ${amount}</p><div class="timing-track"><span id="paymentZone" class="timing-zone" style="left:${(p.target-p.width/2)*100}%;width:${p.width*100}%"></span><span id="paymentNeedle" class="timing-needle"></span></div><p class="sub">Einmal A / E im grünen Bereich drücken. Der Treffer bezahlt den gesamten Einkauf.</p></div>`;}else if(p.cashMode==='keypad'){content+=cashKeypadHTML();}else{content+=`<div class="payment-game"><span class="game-step">2 · RÜCKGELD</span><p>Erhalten: <b>${money(p.givenCents/100)}</b> · Einkauf: <b>${amount}</b></p><div class="change-total">Rückgeld: <b>${money((p.givenCents-p.totalCents)/100)}</b><br>Zusammengestellt: <b id="changeTotal">0,00 €</b></div><div class="cash-coins">${PAYMENT_COINS.map((value,i)=>`<div id="cashChoice${i}" class="cash-choice" role="button" onclick="selectCashCoin(${i})"><strong>${money(value/100)}</strong><small id="cashCount${i}">0 ×</small></div>`).join('')}<div id="cashChoice8" class="cash-choice cash-command" role="button" onclick="cashCommand(8)">Leeren</div><div id="cashChoice9" class="cash-choice cash-command" role="button" onclick="cashCommand(9)">Ausgeben</div></div><button type="button" onclick="openCashKeypad()">▦ Kassen-Numpad öffnen</button><p class="sub">Münzen antippen oder ← → wählen und A hinzufügen. Rückgeld passend? Noch einmal A zum Bezahlen. ↓ entfernt eine Münze.</p></div>`;}content+='<p id="paymentStatus" class="payment-status" role="status"></p><p class="sub">B bricht ohne Abbuchung ab; der Kunde wartet weiter.</p>';show('Bezahlspiel · '+c.profile,content);refreshPaymentUI();}
function refreshPaymentUI(){const p=payment;if(!p)return;if(p.phase==='cash'&&p.cashMode==='keypad'){refreshCashKeypad();return;}$('paymentStatus').textContent=p.phase==='cash'&&cashReady()?'Rückgeld stimmt · A zum Bezahlen.':p.message;if(p.phase==='cash'){const sum=p.counts.reduce((n,count,i)=>n+count*PAYMENT_COINS[i],0);$('changeTotal').textContent=money(sum/100);for(let i=0;i<10;i++){const e=$('cashChoice'+i);if(e){e.classList.toggle('cash-selected',i===p.choice);if(i===p.choice&&p.lastChoice!==p.choice)e.scrollIntoView({block:'nearest'});}if(i<8)$('cashCount'+i).textContent=p.counts[i]+' ×';}p.lastChoice=p.choice;$('actionLabel').textContent=cashReady()?'Bezahlen':'Münze';$('interact').setAttribute('aria-label',$('actionLabel').textContent+' · A oder E');}else{$('paymentNeedle').style.left=paymentNeedle(p)*100+'%';}}
function adjustCash(delta){const p=payment;if(!p||p.phase!=='cash'||p.choice>=8)return;p.counts[p.choice]=Math.max(0,Math.min(100,p.counts[p.choice]+delta));p.message='Münzen antippen oder mit ← → wählen und A hinzufügen.';refreshPaymentUI();}
const CASH_PAD=['7','8','9','4','5','6','1','2','3',',','0','back','clear','confirm','coins'];
function cashEntryCents(p=payment){if(!p||!/^[0-9]{1,5}(,[0-9]{0,2})?$/.test(p.cashEntry))return null;const [euros,cents='']=p.cashEntry.split(',');return Number(euros)*100+Number(cents.padEnd(2,'0'));}
function cashKeypadHTML(){const p=payment;return `<div class="cash-register"><div class="register-display"><small>BARZAHLUNG · WECHSELBETRAG EINGEBEN</small><p>Einkauf: <b>${money(p.totalCents/100)}</b></p><p>Erhalten: <b>${money(p.givenCents/100)}</b></p><p>Rückgeld: <b>${money((p.givenCents-p.totalCents)/100)}</b></p><output id="cashEntryDisplay" aria-live="polite">0 €</output></div><div class="register-pad" role="group" aria-label="Kassen-Numpad">${CASH_PAD.map((key,i)=>`<button type="button" id="cashPad${i}" class="register-key ${key==='confirm'?'register-confirm':''}" aria-label="${key==='back'?'Letzte Ziffer löschen':key==='clear'?'Eingabe leeren':key==='confirm'?'Rückgeld auszahlen':key==='coins'?'Münzen auswählen':key}" onclick="cashKey('${key}')">${key==='back'?'⌫':key==='clear'?'C':key==='confirm'?'Auszahlen':key==='coins'?'Münzen':key}</button>`).join('')}</div><p class="sub">Betrag in Euro eingeben, z. B. 5,00. Touch oder Zahlen auf der Tastatur · Steuerkreuz + A · Enter bestätigt.</p></div>`;}
function refreshCashKeypad(){const p=payment;if(!p)return;$('cashEntryDisplay').textContent=(p.cashEntry||'0')+' €';$('paymentStatus').textContent=cashReady()?'Rückgeld stimmt · A oder Auszahlen zum Abschließen.':p.message;for(let i=0;i<CASH_PAD.length;i++){const e=$('cashPad'+i);if(e){e.classList.toggle('pad-selected',false);e.classList.toggle('cash-selected',i===p.padChoice);if(i===p.padChoice&&p.lastPadChoice!==p.padChoice)e.scrollIntoView({block:'nearest'});}}p.lastPadChoice=p.padChoice;$('actionLabel').textContent=cashReady()?'Auszahlen':CASH_PAD[p.padChoice]==='confirm'?'Auszahlen':'Taste';$('interact').setAttribute('aria-label',$('actionLabel').textContent+' · A oder E');}
function cashKey(key){const p=payment;if(!p||p.phase!=='cash'||p.cashMode!=='keypad')return;const keyIndex=CASH_PAD.indexOf(key);if(keyIndex>=0)p.padChoice=keyIndex;if(key==='coins'){p.cashMode='coins';p.choice=0;p.message='Münzen antippen oder mit links/rechts auswählen.';renderPayment();return;}if(key==='confirm'){const cents=cashEntryCents(p);if(cents===null){p.message='Bitte zuerst einen Betrag eingeben.';refreshPaymentUI();return;}if(cents!==p.givenCents-p.totalCents){p.message='Das Rückgeld stimmt noch nicht. Benötigt: '+money((p.givenCents-p.totalCents)/100)+'.';refreshPaymentUI();return;}p.authorized=true;finishPayment();return;}if(key==='clear')p.cashEntry='';else if(key==='back')p.cashEntry=p.cashEntry.slice(0,-1);else if(key===','){if(!p.cashEntry.includes(','))p.cashEntry=(p.cashEntry||'0')+',';}else if(/^[0-9]$/.test(key)){let next=p.cashEntry==='0'?key:p.cashEntry+key;if(/^[0-9]{0,5}(,[0-9]{0,2})?$/.test(next))p.cashEntry=next;}else return;p.message='Wechselbetrag eingeben und Auszahlen drücken.';refreshPaymentUI();}
function openCashKeypad(){if(!payment||payment.phase!=='cash')return;payment.cashMode='keypad';payment.cashStep='change';payment.cashEntry='';payment.padChoice=0;payment.message='Nur den Wechselbetrag eingeben und Auszahlen drücken.';renderPayment();}
function cashSum(p=payment){return p.cashMode==='keypad'?(cashEntryCents(p)??0):p.counts.reduce((n,count,i)=>n+count*PAYMENT_COINS[i],0);}
function cashReady(){return !!payment&&payment.phase==='cash'&&(payment.cashMode!=='keypad'||(payment.cashStep==='change'&&cashEntryCents()!==null))&&cashSum()===payment.givenCents-payment.totalCents;}
function selectCashCoin(i){if(!payment||payment.phase!=='cash'||!Number.isInteger(i)||i<0||i>=PAYMENT_COINS.length)return;payment.choice=i;adjustCash(1);}
function cashCommand(choice){if(!payment||payment.phase!=='cash')return;if(choice===8){payment.counts=PAYMENT_COINS.map(()=>0);payment.message='Rückgeld zurückgesetzt.';refreshPaymentUI();return;}if(choice===9){if(cashReady()){payment.authorized=true;finishPayment();return;}const difference=payment.givenCents-payment.totalCents-cashSum();payment.message=difference>0?'Es fehlen noch '+money(difference/100)+'.':'Das sind '+money(-difference/100)+' zu viel.';refreshPaymentUI();}}
function paymentInput(){const p=payment;if(!p||p.cool>0)return;if(p.phase==='cash'){if(p.cashMode==='keypad'){if(cashReady())cashKey('confirm');else cashKey(CASH_PAD[p.padChoice]);return;}if(cashReady()){p.authorized=true;finishPayment();return;}if(p.choice<8)adjustCash(1);else cashCommand(p.choice);return;}
if(p.phase!=='card')return;if(Math.abs(paymentNeedle(p)-p.target)>p.width/2){p.cool=.3;p.message='Noch einmal: A drücken, sobald der Zeiger im grünen Bereich steht.';refreshPaymentUI();return;}p.cardHits=1;p.authorized=true;finishPayment();}

function updatePayment(dt){const p=payment;if(!p||!$('modal').open||document.hidden)return;p.clock+=dt;p.cool=Math.max(0,p.cool-dt);p.uiClock+=dt;if(p.phase==='cash'){const dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),direction=dx+','+dy;if(!dx&&!dy){p.repeat=0;p.direction='';}else{p.repeat-=dt;if(direction!==p.direction||p.repeat<=0){p.direction=direction;p.repeat=.16;if(p.cashMode==='keypad'){const row=Math.floor(p.padChoice/3),col=p.padChoice%3;p.padChoice=Math.max(0,Math.min(4,row+dy))*3+Math.max(0,Math.min(2,col+dx));}else if(dx)p.choice=(Math.min(p.choice,7)+dx+8)%8;else adjustCash(-dy);refreshPaymentUI();}}}if(p.uiClock>=1/30){p.uiClock=0;refreshPaymentUI();}}
function finishPayment(){const p=payment;if(!p||!p.authorized)return;payment=null;if(p.customer.state!=='queue'||readyCustomer(p.customer.target)!==p.customer){closePanel();toast('Dieser Verkauf ist nicht mehr aktiv.');return;}purchase(p.customer);closePanel();}
function abortPayment(){if(!payment)return;payment=null;closePanel();toast('Bezahlspiel abgebrochen · keine Abbuchung, Kunde wartet weiter.');}

function openProductGrid(){const f=selection;if(!S.furniture.includes(f)||!FURN[f.kind]?.type)return;const products=PRODUCTS.filter(p=>p.type===FURN[f.kind].type&&unlocked(p));currentPanel='productGrid';show('Produkt auswählen · '+FURN[f.kind].name,`<p class="sub">WASD / Steuerkreuz bewegt die Auswahl im Raster. A übernimmt das Produkt, B kehrt ohne Änderung zurück.</p><div id="productGrid" class="product-grid" role="grid" aria-label="Passende Produkte">${products.map(p=>`<button class="product-tile ${p.id===f.pid?'is-current':''}" data-product="${p.id}" role="gridcell" aria-label="${p.name}, ${S.stock[p.id]} Stück im Lager${p.id===f.pid?', aktuell zugeordnet':''}" onclick="chooseShelfProduct(${p.id})"><span class="product-token ${p.type}" style="--product-color:${productColor(p.id)}" aria-hidden="true"></span><b>${p.name}</b><small>${S.stock[p.id]} im Lager</small><span class="assignment">${p.id===f.pid?'✓ Aktuell zugeordnet':'A · Zuordnen'}</span></button>`).join('')}</div>`);focusMenu(Math.max(0,products.findIndex(p=>p.id===f.pid)));}
function chooseShelfProduct(id){const f=selection,p=PRODUCTS[id];if(!S.furniture.includes(f)||!p||!unlocked(p)||p.type!==FURN[f.kind]?.type){toast('Dieses Produkt passt nicht in das Möbel.');return;}S.stock[f.pid]+=f.qty;f.qty=0;f.pid=id;refill(f);save();shelfPanel(f);toast(p.name+' zugeordnet · '+f.qty+' Stück eingeräumt.');}
function navigateProductGrid(dx,dy){const list=menuTargets();if(!list.length)return;let columns=window.innerWidth&&window.innerWidth<=560?2:4;const grid=$('productGrid');if(grid&&typeof getComputedStyle==='function'){const tracks=getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean);if(tracks.length>1)columns=tracks.length;}const row=Math.floor(menuFocus/columns),col=menuFocus%columns,rows=Math.ceil(list.length/columns);let next;if(dy){const nr=Math.max(0,Math.min(rows-1,row+dy));next=Math.min(nr*columns+col,list.length-1);}else{next=row*columns+Math.max(0,Math.min(Math.min(columns-1,list.length-1-row*columns),col+dx));}focusMenu(next);}
function fillAndClose(){const success=refill(selection);closePanel();toast(success?'Ware wird eingeräumt.':'Keine passende Ware im Lager oder Möbel bereits voll.');}

// OBERFLÄCHE: einkaufen, planen, Personal und Spielstände.
function editing(){return !!placing||moveMode;}
function show(t,h){priceEdit=null;$('title').textContent=t;$('body').innerHTML=h;if(!$('modal').open)$('modal').show();keys={};menuFocus=0;cursorDirection='';cursorRepeat=0;focusMenu(0);hud();}
function closePanel(){pendingCheckout=null;payment=null;$('modal').close();priceEdit=null;keys={};cursorRepeat=0;cursorDirection='';hud();}
function basePanel(name){pendingCheckout=null;payment=null;currentPanel=name;if(name==='menu'){show('Pokermart · Spielmenü · 2.0',`<div class="notice">${editing()?'Möbelmodus aktiv · Menü schließen, um den Cursor weiterzubewegen.':'WASD / Steuerkreuz: laufen · A / E: interagieren · Q: Menü'}</div><div class="game-menu"><button id="openBtn" onclick="S.open=!S.open;hud();panel('menu')">${S.open?'● Laden schließen':'○ Laden öffnen'}<small>Kunden empfangen oder Einlass stoppen</small></button><button id="pauseBtn" onclick="S.paused=!S.paused;hud();panel('menu')">${S.paused?'▶ Fortsetzen':'Ⅱ Pause'}<small>Simulation anhalten oder fortsetzen</small></button><button onclick="panel('supply')">▣ Einkauf & Import<small>Neue Ware und Lieferungen</small></button><button onclick="panel('products')">€ Preise einstellen<small>Sortiment · A bearbeiten · ↑ ↓ ändern</small></button><button onclick="panel('build')">▦ Möbel kaufen & Ausbau<small>WASD setzt den Möbelcursor</small></button><button id="moveBtn" onclick="startMoveMode()">↔ Möbel verschieben<small>WASD wählen · A aufnehmen und abstellen</small></button><button onclick="panel('staff')">♙ Mitarbeitende<small>Personal einstellen und verwalten</small></button><button onclick="panel('career')">Ladenbuch<small>Aufträge, Ränge und Belohnungen</small></button><button onclick="panel('suppliers')">Lieferanten<small>Beziehungen, Rabatte und Lieferzeiten</small></button><button onclick="panel('regulars')">Stammkunden<small>Bindung und besondere Wünsche</small></button><button onclick="panel('upgrades')">Ausstattung<small>Mehr Kapazität und Automatisierung</small></button><button onclick="panel('storage')">Lagerbestand<small>Vorrat, Auslagen und Lieferungen</small></button><button onclick="panel('goals')">Sortiment-Freigaben<small>Weitere Produkte freischalten</small></button><button onclick="panel('manage')">⚙ Management & Spielstand<small>Speichern, Export und Import</small></button><button onclick="panel('help')">? Spielhilfe<small>Steuerung und Abläufe</small></button><label class="card">Ansicht / Zoom<small>Links / rechts ändern den Zoom</small><input type="range" min="0.6" max="2.4" step="0.05" value="${S.zoom}" oninput="setZoom(this.value)" aria-label="Zoom im Menü"></label>${(moving?.kind||placing)==='checkout'?'<button onclick="rotatePreview()">↻ Kasse 90° drehen<small>Zweifeld-Vorschau drehen und mit A platzieren</small></button>':''}${editing()?'<button onclick="closePanel();backAction()">✕ Möbelmodus beenden<small>Ohne Kauf oder Umstellen abbrechen</small></button>':''}</div>`);hud();}else if(name==='supply' ||name==='products'){show(name==='supply'?'Einkauf & Warenimport':'Sortiment & Preisgestaltung',`<div class="row"><input id="search" type="search" hidden placeholder="Produkt suchen …" oninput="productRows('${name}')"><select id="category" onchange="productRows('${name}')"><option value="all">Alle Möbeltypen</option><option value="shelf">Regal</option><option value="cold">Kühlung</option><option value="frozen">Gefriertruhe</option></select><span class="pill">${PRODUCTS.filter(unlocked).length} / 160 freigeschaltet</span></div><div class="notice">${name==='supply'?'Ausgewählter Lieferant: '+SUPPLIERS[S.career.supplier].name+'. Preise und Lieferzeiten enthalten Beziehungsrabatte und Ereignisse. Nach Ankunft im Lager annehmen.':'Preis antippen oder mit den Richtungen auswählen. A: bearbeiten · ↑ ↓: 0,05 € ändern · ← →: 0,50 € ändern · A: speichern · B: abbrechen.'}</div><div style="overflow:auto"><table><thead><tr><th>Produkt</th><th>EK</th><th>Lager</th><th>${name==='supply'?'Bestellen':'VK / Stück'}</th></tr></thead><tbody id="productRows"></tbody></table></div>`);productRows(name);focusMenu(0);}
else if(name==='build'){show('Möbel & Ladenausbau',`<button onclick="startMoveMode()">↔ Vorhandene Möbel kostenlos verschieben</button><p class="sub">Regale und Kühlschränke können direkt in der obersten Bodenreihe bündig an die Rückwand gesetzt werden. Möbel auswählen, mit WASD / Steuerkreuz ein freies Feld wählen und A / E drücken. B / Escape bricht ab. Laufwege und der Zugang zu allen Möbeln bleiben frei.</p><div class="cards">${Object.entries(FURN).map(([k,f])=>`<div class="card"><h3>${f.name}</h3><p>${f.type?'24–48 Plätze · nur '+({shelf:'Trockenware',cold:'Kühlprodukte',frozen:'Tiefkühlprodukte'}[f.type]):k==='self'?'Bedient Kunden selbstständig.':k==='checkout'?'Zwei Felder: Warenablage und Kasse. Mit R oder über Menü drehbar.':k==='deposit'?'Kunden geben Flaschen zurück. Pfandservice per E abrechnen.':k==='bin'?'Abfälle mit E entsorgen.':'Dekoration für deinen Shop.'}</p><button ${S.money<f.cost||careerRank()<buildingRank(k)?'disabled':''} onclick="startBuild('${k}')">${careerRank()<buildingRank(k)?'Ab Rang '+(buildingRank(k)+1):money(f.cost)+' · Platzieren'}</button></div>`).join('')}<div class="card"><h3>${layout().name} · Stufe ${S.expanded+1}/4</h3><p>Verkaufsfläche: ${(layout().shop[2]-layout().shop[0]+1)*(layout().shop[3]-layout().shop[1]+1)} Felder.<br>${STAGES[S.expanded+1]?'Nächster Ausbau: '+STAGES[S.expanded+1].name+'. Zusätzliche Fläche und größeres Lager; vorhandene Möbel bleiben stehen.':'Maximale Ladengröße erreicht.'}</p><button ${!STAGES[S.expanded+1]||!expansionReady()||S.money<STAGES[S.expanded+1].cost?'disabled':''} onclick="expand()">${STAGES[S.expanded+1]?(expansionReady()?money(STAGES[S.expanded+1].cost)+' · Ausbauen':'Benötigt Rang '+([0,2,4,6][S.expanded+1]+1)):'Vollständig ausgebaut'}</button></div></div>`);}
else if(name==='staff'){show('Dein Team',`<p class="sub">Personal arbeitet automatisch. Lohn: 85 € pro Person und Spieltag (4 Minuten). Entlassungen sind jederzeit möglich.</p><div class="cards">${Object.entries({cashier:['Kassenkraft','Bedient die normale Kasse.'],stocker:['Lagerkraft','Nimmt Lieferungen an und füllt Auslagen auf.'],cleaner:['Reinigungskraft','Entfernt regelmäßig Schmutz.'],security:['Sicherheit','Stoppt flüchtende Ladendiebe.']}).map(([k,a])=>`<div class="card"><h3>${a[0]} · ${S.staff[k]}</h3><p>${a[1]}</p><button onclick="hire('${k}')" ${S.money<150||S.staff[k]>=10||careerRank()<({cashier:2,stocker:3,cleaner:2,security:4}[k])?'disabled':''}>${careerRank()<({cashier:2,stocker:3,cleaner:2,security:4}[k])?'Ab Rang '+(({cashier:2,stocker:3,cleaner:2,security:4}[k])+1):'Einstellen · 150 €'}</button> <button ${!S.staff[k]?'disabled':''} onclick="fireStaff('${k}')">−</button></div>`).join('')}</div>`);}

function freshCareer(){return{version:1,xp:0,claimed:[],supplier:0,supplierDeliveries:[0,0,0],visits:Array(20).fill(0),loyalty:Array(20).fill(0),requests:[],nextRequest:1,metrics:{orders:0,received:0,refills:0,cleaned:0,built:0,upgrades:0,specials:0},eventDay:1,eventSales:0,eventClaimed:false,dailyDay:1,dailySales:0,dailyClaimed:false};}

function footBlocked(x,y,state=S){if(baseFootBlocked(x,y,state))return true;const store=STAGES[state.expanded].store,cx=x+.5,cy=y+.70;return cy+.16>store[1]&&cy-.16<store[1]+.93&&cx+.27>store[0]&&cx-.27<store[2];}
function removeFurniture(){const f=selection;if(!S.furniture.includes(f))return;if(FURN[f.kind].type)S.stock[f.pid]+=f.qty;S.money=Math.round((S.money+FURN[f.kind].cost*.5)*100)/100;S.furniture=S.furniture.filter(k=>k!==f);closePanel();save();}
function normalizeCareer(state){for(const f of state.furniture)if(f.tier!==undefined&&(!Number.isInteger(f.tier)||f.tier<0||f.tier>2))throw Error("Invalid furniture tier");const old=state.career;if(old===undefined){state.career=freshCareer();state.career.xp=Math.max((state.served||0)*18,[0,240,900,2600][state.expanded]);state.career.eventDay=state.day;state.career.dailyDay=state.day;return state;}if(!old||old.version!==1||!Number.isFinite(old.xp)||old.xp<0||!Array.isArray(old.claimed)||!old.claimed.every(id=>CAREER_MISSIONS.some(m=>m.id===id))||new Set(old.claimed).size!==old.claimed.length)throw Error('Ungültiger Ladenfortschritt');const defaults=freshCareer();for(const key of ['supplierDeliveries','visits','loyalty'])if(!Array.isArray(old[key])||old[key].length!==defaults[key].length||!old[key].every(v=>Number.isInteger(v)&&v>=0&&v<=1e7))throw Error('Ungültige Beziehungen');if(!Number.isInteger(old.supplier)||!SUPPLIERS[old.supplier]||!Array.isArray(old.requests)||old.requests.length>4||!old.requests.every(q=>Number.isInteger(q.id)&&Number.isInteger(q.profile)&&q.profile>=0&&q.profile<20&&PRODUCTS[q.pid]&&Number.isInteger(q.qty)&&q.qty>0&&q.qty<=50&&Number.isInteger(q.dueDay)&&q.dueDay>0)||new Set(old.requests.map(q=>q.id)).size!==old.requests.length)throw Error('Ungültige Stammkundenaufträge');for(const key of ['eventDay','dailyDay','nextRequest'])if(!Number.isInteger(old[key])||old[key]<1)throw Error('Ungültiger Fortschrittstag');for(const key of ['eventSales','dailySales'])if(!Number.isFinite(old[key])||old[key]<0)throw Error('Ungültiger Tagesfortschritt');if(typeof old.eventClaimed!=='boolean'||typeof old.dailyClaimed!=='boolean'||!old.metrics||!Object.keys(defaults.metrics).every(k=>Number.isFinite(old.metrics[k])&&old.metrics[k]>=0))throw Error('Ungültige Aufträge');for(const f of state.furniture)if(f.tier!==undefined&&(!Number.isInteger(f.tier)||f.tier<0||f.tier>2))throw Error('Ungültige Möbelstufe');state.career={...defaults,...old};return state;}
function careerRank(state=S){const xp=state.career?.xp||0;let rank=0;for(let i=1;i<CAREER_RANKS.length;i++)if(xp>=CAREER_RANKS[i].xp)rank=i;return rank;}
function addXP(amount){const before=careerRank();S.career.xp+=Math.max(0,Math.floor(amount));if(careerRank()>before){record('Neuer Ladenrang: '+CAREER_RANKS[careerRank()].name);toast('RANG AUF! '+CAREER_RANKS[careerRank()].name);} }
function missionMetric(m){if(m.metric==='served')return S.served;if(m.metric==='expanded')return S.expanded;if(m.metric==='team')return Object.values(S.staff).reduce((a,b)=>a+b,0);if(m.metric==='variety')return new Set(S.furniture.filter(f=>FURN[f.kind].type&&f.qty>0).map(f=>FURN[f.kind].type)).size;if(m.metric==='regulars')return S.career.visits.filter(v=>v>=3).length;return S.career.metrics[m.metric]||0;}
function missionAvailable(m){return !m.requires||S.career.claimed.includes(m.requires);}
function claimMission(id){const m=CAREER_MISSIONS.find(m=>m.id===id);if(!m||!missionAvailable(m)||S.career.claimed.includes(id)||missionMetric(m)<m.goal)return;S.career.claimed.push(id);S.money=Math.round((S.money+m.cash)*100)/100;addXP(m.xp);record('Auftrag erfüllt: '+m.title+' · '+money(m.cash));save();panel('career');}
function currentEvent(){return MARKET_EVENTS[(Math.floor((S.day-1)/1))%MARKET_EVENTS.length];}
function syncCareerDay(){const p=S.career;if(p.eventDay!==S.day){p.eventDay=S.day;p.eventSales=0;p.eventClaimed=false;}if(p.dailyDay!==S.day){p.dailyDay=S.day;p.dailySales=0;p.dailyClaimed=false;for(const q of p.requests)if(q.dueDay<S.day)p.loyalty[q.profile]=Math.max(0,p.loyalty[q.profile]-5);p.requests=p.requests.filter(q=>q.dueDay>=S.day);}}
function claimDayReward(event=false){syncCareerDay();const p=S.career,goal=event?currentEvent().target:5+careerRank()*2,count=event?p.eventSales:p.dailySales;if(count<goal||(event?p.eventClaimed:p.dailyClaimed))return;if(event)p.eventClaimed=true;else p.dailyClaimed=true;const amount=event?currentEvent().reward:70+careerRank()*25;S.money=Math.round((S.money+amount)*100)/100;addXP(event?75:45);save();panel('career');}
function supplierTier(id=S.career.supplier){const count=S.career.supplierDeliveries[id]||0;let tier=0;for(let i=1;i<SUPPLIER_STEPS.length;i++)if(count>=SUPPLIER_STEPS[i])tier=i;return tier;}

function acceptCrate(actor=S.player){if(!S.crates.length)return false;const c=S.crates.shift();S.stock[c.pid]+=c.qty;const supplier=Number.isInteger(c.supplier)&&SUPPLIERS[c.supplier]?c.supplier:0;S.career.supplierDeliveries[supplier]++;S.career.metrics.received++;addXP(12);act(actor,'carry',storagePoint());if(actor===S.player)toast(c.qty+' × '+PRODUCTS[c.pid].name+' eingelagert.');save();return true;}

function upgradeCost(f){return Math.round(FURN[f.kind].cost*[(.6),1.1][f.tier||0]);}

function loadSupermarketAtlas(uri){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{if(image.width<1024||image.height<576||Math.abs(image.width/image.height-1024/576)>.03){reject(new Error('Das Sprite-Sheet passt nicht zur 1024×576-Vorlage.'));return;}supermarketAtlas=image;supermarketReady=true;supermarketFrames.clear();pixelAssets.clear();resolve();};image.onerror=()=>reject(new Error('Sprite-Sheet konnte nicht geladen werden.'));image.src=uri;});}
function supermarketCrop(crop,flip=false){const key=crop.join('/')+'/'+flip;if(supermarketFrames.has(key))return supermarketFrames.get(key);const [x,y,w,h]=crop,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const g=canvas.getContext('2d'),sx=supermarketAtlas.width/1024,sy=supermarketAtlas.height/576;g.imageSmoothingEnabled=false;if(flip){g.translate(w,0);g.scale(-1,1);}g.drawImage(supermarketAtlas,x*sx,y*sy,w*sx,h*sy,0,0,w,h);try{const image=g.getImageData(0,0,w,h),data=image.data;for(let p=0;p<data.length;p+=4)if(data[p]<13&&data[p+1]<13&&data[p+2]<13)data[p+3]=0;g.putImageData(image,0,0);}catch{}supermarketFrames.set(key,canvas);return canvas;}
function atlasCharacterFrame(look,dir,step,kind){const employee=look===0,crop=employee?SUPERMARKET_CROPS.employee[dir]:SUPERMARKET_CROPS.customers[(look-1)%20],source=supermarketCrop(crop,!employee&&dir==='left');return pixelStamp(['atlas-person',look,dir,step,kind].join('/'),24,34,(_,g)=>{const stride=[0,1,0,-1][step],w=20,h=31,legs=.74;g.drawImage(source,0,0,source.width,source.height*legs,2,1,w,h*legs);for(let side=0;side<2;side++)g.drawImage(source,side*source.width/2,source.height*legs,source.width/2,source.height*(1-legs),2+side*w/2,1+h*legs+Math.max(0,stride*(side?1:-1)),w/2,h*(1-legs));});}
function drawAtlasFixture(f,labels=true){const source=supermarketCrop(SUPERMARKET_CROPS[f.kind]),x=OX+f.x*T,y=OY+f.y*T,width=T+2,height=Math.min(T+25,width*source.height/source.width);ctx.imageSmoothingEnabled=false;ctx.drawImage(source,Math.round(x-1),Math.round(y+T-height-3),width,height);if(FURN[f.kind].type){const frontY=y+T-height+8,rows=3,visible=Math.ceil(Math.min(1,f.qty/furnitureCapacity(f))*18);rect(x+3,frontY,T-6,Math.max(18,height-17),f.kind==='shelf'?'#5b6259':'#9abac1');for(let row=0;row<rows;row++){for(let col=0;col<6;col++)if(row*6+col<visible)drawProduct(f.pid,x+4+col*6,frontY+row*9,5,7);rect(x+3,frontY+row*9+8,T-6,1,PX.cream);}if(!f.qty)textAt('LEER',x+23,frontY+18,PX.cream,7);if(labels&&furnitureDistance(S.player,f)<1.6)textAt(f.qty+'/'+furnitureCapacity(f),x+23,y+T+7,PX.ink,7);}}
function drawAtlasCheckout(f){const source=supermarketCrop(SUPERMARKET_CROPS.checkout),n=checkoutFacing(f);ctx.save();ctx.translate(OX+(f.x+.5)*T,OY+(f.y+.5)*T);ctx.rotate(Math.atan2(n.y,n.x)-Math.PI/2);ctx.imageSmoothingEnabled=false;const w=2*T,h=w*source.height/source.width;ctx.drawImage(source,-1.5*T,-h/2,w,h);const c=queueHead(f);if(c)c.cart.slice(0,3).forEach((id,i)=>drawProduct(id,-T-15+i*9,-6,6,9));ctx.restore();}
if(SUPERMARKET_ATLAS_SOURCE)loadSupermarketAtlas(SUPERMARKET_ATLAS_SOURCE).catch(err=>toast(err.message));

// LADENBUCH — all actions remain reachable through Menu, directions and A/B.
function rankSummary(){const rank=careerRank(),next=CAREER_RANKS[rank+1],floor=CAREER_RANKS[rank].xp,range=next?next.xp-floor:1,value=next?S.career.xp-floor:1;return`<div class="rank-banner"><span class="pixel-badge">${rank+1}</span><div><small>LADENRANG ${rank+1} / ${CAREER_RANKS.length}</small><h3>${CAREER_RANKS[rank].name}</h3><progress value="${value}" max="${range}"></progress><p>${next?S.career.xp+' / '+next.xp+' EP · Nächster Rang: '+next.name:'Meisterrang erreicht · '+S.career.xp+' EP'}</p><small>${CAREER_RANKS[rank].perk}</small></div></div>`;}
function careerHTML(){syncCareerDay();const p=S.career,event=currentEvent(),dailyGoal=5+careerRank()*2;return rankSummary()+`<div class="notice">Vom Kiosk zum Supermarkt: Kunden bedienen, Aufträge erfüllen und Belohnungen abholen. Erfahrung schaltet neue Arbeitserleichterungen frei.</div><div class="chapter-row">${STAGES.map((stage,i)=>`<div class="chapter ${S.expanded===i?'current':''}"><b>${i+1} · ${stage.name}</b><small>${S.expanded>=i?'Erreicht':money(stage.cost)+' · Rang '+([0,2,4,6][i]+1)}</small></div>`).join('')}</div><h3>Heute im Viertel · Tag ${S.day}</h3><div class="cards"><div class="card"><span class="eyebrow">TAGESAUFTRAG</span><h3>Gut besucht</h3><p>${p.dailySales} / ${dailyGoal} Artikel verkaufen · ${money(70+careerRank()*25)} + 45 EP</p><progress value="${Math.min(p.dailySales,dailyGoal)}" max="${dailyGoal}"></progress><button ${p.dailyClaimed||p.dailySales<dailyGoal?'disabled':''} onclick="claimDayReward(false)">${p.dailyClaimed?'Belohnung abgeholt':'Tagesbelohnung abholen'}</button></div><div class="card"><span class="eyebrow">WOCHENKALENDER · ${((S.day-1)%7)+1} / 7</span><h3>${event.name}</h3><p>${event.text}</p><p>${p.eventSales} / ${event.target} bediente Kunden · ${money(event.reward)} + 75 EP</p><button ${p.eventClaimed||p.eventSales<event.target?'disabled':''} onclick="claimDayReward(true)">${p.eventClaimed?'Ereignis abgeschlossen':'Ereignisbelohnung abholen'}</button></div></div><h3>Dein Weg zum Lieblingsmarkt</h3><div class="cards">${CAREER_MISSIONS.map(m=>{const done=p.claimed.includes(m.id),available=missionAvailable(m),value=missionMetric(m);return`<div class="card quest ${done?'quest-done':''}"><span class="eyebrow">${done?'ABGESCHLOSSEN':available?'DEIN AUFTRAG':'SPÄTER'}</span><h3>${m.title}</h3><p>${m.text}</p><progress value="${Math.min(value,m.goal)}" max="${m.goal}"></progress><p>${Math.min(value,m.goal)} / ${m.goal} · ${money(m.cash)} + ${m.xp} EP</p><button ${done||!available||value<m.goal?'disabled':''} onclick="claimMission('${m.id}')">${done?'Erledigt':!available?'Vorherigen Auftrag abschließen':'Belohnung abholen'}</button></div>`;}).join('')}</div>`;}
function suppliersHTML(){return`<p class="sub">Eine Bestellung umfasst 12 Stück. Beziehungsstufen steigen durch tatsächlich angenommene Lieferkartons. Stufe 1/2/3/4: jeweils 3 % mehr Rabatt und 10 % kürzere Grundlieferzeit. Engpässe werden beim Bestellen berücksichtigt.</p><div class="cards">${SUPPLIERS.map((s,i)=>{const tier=supplierTier(i),count=S.career.supplierDeliveries[i],available=supplierAvailable(i);return`<div class="card supplier ${S.career.supplier===i?'selected-supplier':''}"><span class="supplier-stamp" style="--stamp:${s.color}"></span><span class="eyebrow">${s.tag} · STUFE ${tier}</span><h3>${s.name}</h3><p>${s.description}</p><p>${count} Kartons angenommen · ${tier<4?'nächste Stufe bei '+SUPPLIER_STEPS[tier+1]:'Meisterbeziehung'}</p><p>${Math.round((1-s.factor*(1-tier*.03))*100)} % Preisvorteil zum Listenpreis · ${Math.ceil(s.seconds*(1-tier*.1))} s Grundlieferzeit</p><button ${!available?'disabled':''} onclick="chooseSupplier(${i})">${available?(S.career.supplier===i?'Ausgewählt':'Als Lieferant wählen'):'Ab Ladenrang '+(s.rank+1)}</button></div>`;}).join('')}</div><button class="primary" onclick="panel('supply')">Waren bestellen</button>`;}
function regularsHTML(){const p=S.career;return`<p class="sub">Nach drei erfolgreichen Einkäufen werden Nachbarn zu Stammkunden. Gute Preise, Sauberkeit und verlässlicher Bestand erhöhen ihre Bindung. Stammkunden kommen gezielter wieder und geben größere Wünsche auf. Wünsche werden aus dem Lagerbestand erfüllt und bringen 20 % Auftragsbonus.</p><h3>Besondere Bestellungen</h3><div class="cards">${p.requests.length?p.requests.map(q=>`<div class="card"><span class="eyebrow">BIS TAG ${q.dueDay}</span><h3>${PROFILES[q.profile]}s Wunsch</h3><p>${q.qty} × ${PRODUCTS[q.pid].name}<br>${S.stock[q.pid]} Stück im Lager</p><p>Vergütung: ${money(Math.round(S.prices[q.pid]*q.qty*1.2*100)/100)} · 65 EP</p><button ${S.stock[q.pid]<q.qty?'disabled':''} onclick="fulfillRequest(${q.id})">Aus Lager liefern</button></div>`).join(''):'<div class="notice">Noch keine Wünsche. Bediene wiederkehrende Kunden jeweils dreimal.</div>'}</div><h3>Deine Nachbarschaft</h3><div class="cards">${PROFILES.map((name,i)=>`<div class="card"><span class="eyebrow">${p.visits[i]>=3?'STAMMKUNDE':p.visits[i]?'KENNT DEINEN LADEN':'NOCH UNBEKANNT'}</span><h3>${name}</h3><p>${p.visits[i]} Einkäufe · Lieblingsgruppe: ${PRODUCT_NAMES[i%10]}</p><progress value="${p.loyalty[i]}" max="100"></progress><p>Bindung: ${p.loyalty[i]} %${p.visits[i]<3?' · '+Math.max(0,3-p.visits[i])+' Besuch(e) bis Stammkunde':''}</p></div>`).join('')}</div>`;}
function upgradesHTML(){const items=S.furniture.map((f,i)=>({f,i})).filter(({f})=>FURN[f.kind].type||['checkout','self'].includes(f.kind));return`<p class="sub">Möbel bleiben beim Aufwerten am Platz und behalten ihre Ware. Warenmöbel erhalten 36 bzw. 48 Plätze. Kassenpersonal kassiert schneller; bessere Kassen vergrößern das grüne Kartenfeld. Stufe 1 benötigt Rang 3, Stufe 2 Rang 5.</p><div class="cards">${items.map(({f,i})=>`<div class="card"><span class="eyebrow">FELD ${f.x} / ${f.y} · STUFE ${f.tier||0} / 2</span><h3>${FURN[f.kind].name}</h3><p>${FURN[f.kind].type?PRODUCTS[f.pid].name+' · '+f.qty+' / '+furnitureCapacity(f):upgradeEffect(f)}</p><p>${(f.tier||0)<2?'Nächste Stufe: '+(FURN[f.kind].type?(furnitureCapacity(f)+12)+' Plätze':'schneller kassieren'):'Vollständig aufgewertet'}</p><button ${!canUpgrade(f)||careerRank()<((f.tier||0)?4:2)||S.money<upgradeCost(f)?'disabled':''} onclick="upgradeFurniture(${i})">${canUpgrade(f)?money(upgradeCost(f))+' · Aufwerten':'Maximale Stufe'}</button></div>`).join('')}</div>`;}
function panel(name){if(['career','suppliers','regulars','upgrades','storage'].includes(name)){pendingCheckout=null;payment=null;currentPanel=name;const titles={career:'Ladenbuch · Dein Fortschritt',suppliers:'Deine Lieferanten',regulars:'Stammkunden & Wünsche',upgrades:'Ausstattung aufwerten',storage:'Lagerbestand'};show(titles[name],name==='career'?careerHTML():name==='suppliers'?suppliersHTML():name==='regulars'?regularsHTML():name==='upgrades'?upgradesHTML():storageHTML());return;}basePanel(name);}
function storageHTML(){const rows=PRODUCTS.filter(p=>S.stock[p.id]>0||S.orders.some(o=>o.pid===p.id)||S.crates.some(c=>c.pid===p.id));return`<p class="sub">Ware in angenommenen Lieferkartons ist sofort im Vorrat. Offene Lieferungen und Kartons an der Annahme sind gesondert aufgeführt.</p><div class="table-scroll"><table><thead><tr><th>Produkt</th><th>Vorrat</th><th>Auslagen</th><th>Unterwegs / Annahme</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.name}</td><td>${S.stock[p.id]}</td><td>${S.furniture.filter(f=>f.pid===p.id).reduce((sum,f)=>sum+f.qty,0)}</td><td>${S.orders.filter(o=>o.pid===p.id).reduce((sum,o)=>sum+o.qty,0)} / ${S.crates.filter(c=>c.pid===p.id).reduce((sum,c)=>sum+c.qty,0)}</td></tr>`).join('')}</tbody></table></div>`;}
function shelfPanel(f){if(!S.furniture.includes(f)||!FURN[f.kind]?.type)return;selection=f;currentPanel='shelf';show(FURN[f.kind].name,`<span class="eyebrow">AUSSTATTUNG · STUFE ${f.tier||0}</span><h3>${PRODUCTS[f.pid].name}</h3><p>${f.qty} / ${furnitureCapacity(f)} Stück in der Auslage · ${S.stock[f.pid]} im Lager</p><button class="primary" onclick="fillAndClose()">Aus Lager auffüllen</button><hr><button onclick="openProductGrid()">Produkt im Auswahlraster wählen</button><button onclick="openShelfPrice()">Verkaufspreis einstellen · ${money(S.prices[f.pid])}</button><button onclick="panel('upgrades')">Möbel aufwerten</button><hr><button onclick="beginMove(selection)">Möbel verschieben</button><button onclick="removeFurniture()">Verkaufen · ${money(FURN[f.kind].cost*.5)}</button>`);}
function productRows(mode){const term=$('search').value.toLowerCase(),type=$('category').value,rows=PRODUCTS.filter(p=>unlocked(p)&&p.name.toLowerCase().includes(term)&&(type==='all'||p.type===type));$('productRows').innerHTML=rows.map(p=>{const quote=quoteOrder(p.id);return`<tr><td><b>${p.name}</b><br><span class="sub">${{shelf:'Regal',cold:'Kühlung',frozen:'Gefriertruhe'}[p.type]}</span></td><td>${money(p.cost)}</td><td>${S.stock[p.id]}</td><td>${mode==='supply'?`<button ${S.money<quote.cost?'disabled':''} onclick="order(${p.id},false)">12 × · ${money(quote.cost)}<small> ${quote.eta} s</small></button>`:`<div class="price-control" role="spinbutton" tabindex="0" onclick="editProductPrice(${p.id})" data-price="${p.id}" aria-label="Preis ${p.name}" aria-valuenow="${S.prices[p.id]}" aria-valuemin="0.01" aria-valuemax="999">${money(S.prices[p.id])}<small>A bearbeiten · ↑ ↓ ändern</small></div>`}</td></tr>`;}).join('');}
let journeyMemo='';
function hud(){baseHud();const rank=careerRank(),next=CAREER_RANKS[rank+1],mission=CAREER_MISSIONS.find(m=>missionAvailable(m)&&!S.career.claimed.includes(m.id)),event=currentEvent(),text=CAREER_RANKS[rank].name+' · '+(next?S.career.xp+'/'+next.xp+' EP':'Meisterrang')+'|'+(mission?mission.title+' '+Math.min(missionMetric(mission),mission.goal)+'/'+mission.goal:'Alle Ladenaufträge erfüllt')+'|'+event.name;if($('journey')&&journeyMemo!==text){journeyMemo=text;const [a,b,c]=text.split('|');$('journey').innerHTML='<span>'+a+'</span><b>'+b+'</b><small>'+c+'</small>';}$('worldtag').textContent=layout().name.toUpperCase()+' · '+(S.open?'GEÖFFNET':'GESCHLOSSEN')+' · RANG '+(rank+1);if(!editing()&&!$('modal').open&&!S.broomHeld){const broom=distance(S.player,broomPoint())<1.35,delivery=distance(S.player,storagePoint())<1.5;if(delivery&&!broom)$('hint').textContent=S.crates.length?'E / A · Lieferung annehmen · '+S.crates.length+' Karton(s)':'E / A · Lagerbestand ansehen';}}

function loop(now){const dt=last?Math.min((now-last)/1000,.08):0;last=now;if(!document.hidden){updatePayment(dt);updateControls(dt);update(dt);animate(dt);}requestAnimationFrame(loop);}hud();draw();requestAnimationFrame(loop);if(!localStorage.getItem('pokermart-v1'))panel('help');if(saveNotice)toast('Lokaler Spielstand konnte nicht geladen werden. Neues Spiel gestartet.');
</script></body></html>
