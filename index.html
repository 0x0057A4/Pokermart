function foodOldWallFixture(kind){return !!FURN[kind]?.type||kind==='deposit';}
function checkoutVector(f){return [[1,0],[0,1],[-1,0],[0,-1]][f.rot||0];}

function openCheckoutControls(f){selection=f;currentPanel='checkoutControls';show('Kasse · Ausrichtung',`<p>Bedienseite: <b>${checkoutSide(f)}</b> · Kundenseite: <b>${checkoutSide(f,false)}</b></p><p class="sub">Der erste Kunde steht direkt vor dem Kassenfeld. Gehe zum Bedienplatz auf der gegenüberliegenden Seite. Zum seitlichen Aufstellen den gesamten Tresen drehen und die Vorschau mit A bestätigen.</p><button type="button" class="primary" onclick="requestCheckout()">Kassenmenü öffnen</button><p class="sub">${queueHead(f)?'Ein Kunde ist auf dem Weg oder bereit zur Zahlung.':'Noch kein Kunde an dieser Kasse. Öffne den Laden und warte auf einen Einkauf.'}</p><button onclick="beginMove(selection);rotatePreview()">↻ Gesamte Kasse 90° drehen</button><button onclick="beginMove(selection)">↔ Kasse verschieben</button>`);}

function baseUpdate(dt){if(S.paused||editing()||($('modal').open&&currentPanel!=='checkoutWaiting'))return;if(pendingCheckout){if(!S.furniture.includes(pendingCheckout)||!playerAtCheckout(pendingCheckout)){pendingCheckout=null;if(currentPanel==='checkoutWaiting'){closePanel();toast('Kassenplatz geändert. Am Fußsymbol erneut öffnen.');}}else if(readyCustomer(pendingCheckout)){const f=pendingCheckout;pendingCheckout=null;serveAtCheckout(f);return;}}if(S.business.phase==='trading')S.time+=dt;if(S.open)S.economy.openSeconds+=dt;spawn+=dt;auto+=dt;staffTick+=dt;for(const o of S.orders)o.eta-=dt;let arrived=S.orders.filter(o=>o.eta<=0);for(const o of arrived){S.crates.push({pid:o.pid,qty:o.qty,supplier:o.supplier});toast('Lieferung angekommen! Im Lager mit A / E annehmen.');}S.orders=S.orders.filter(o=>o.eta>0);
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if((dx||dy)&&!acting(S.player)){face(S.player,{x:S.player.x+dx,y:S.player.y+dy});let d=Math.hypot(dx,dy),nx=S.player.x+dx/d*dt*4,ny=S.player.y+dy/d*dt*4;if(canMove(S.player.x,S.player.y,nx,S.player.y))S.player.x=nx;if(canMove(S.player.x,S.player.y,S.player.x,ny))S.player.y=ny;}
if(S.open&&spawn>5/(currentEvent().traffic*retailTraffic())&&customers.length<[7,11,16,22][S.expanded]){spawn=0;addCustomer();}
for(const c of customers){c.patience-=dt;if(c.state!=='leave'&&c.patience<=0){c.bubble='Zu lange!';leave(c,false);}if(c.path.length){if(acting(c))continue;let p=c.path[0],d=Math.hypot(p[0]-c.x,p[1]-c.y),step=dt*1.9;if(d<=step){c.x=p[0];c.y=p[1];c.path.shift();}else{c.x+=(p[0]-c.x)/d*step;c.y+=(p[1]-c.y)/d*step;}continue;}c.think+=dt;
if(c.state==='shop'&&c.think>1.2){c.think=0;let f=c.target;if(f&&f.qty>0){const p=PRODUCTS[f.pid],tolerance=1.55+(PROFILES.indexOf(c.profile)%7)*.18+(currentEvent().tolerance||0)+(f.tier||0)*.08+(S.career.loyalty[PROFILES.indexOf(c.profile)]||0)*.002;if(S.prices[p.id]>maxAcceptablePrice(c,p)){c.bubble='Zu teuer!';if(!c.cart.length){leave(c,false);continue;}}else if(Math.random()<S.trash.length*.025){c.bubble='Hier ist es schmutzig!';leave(c,false);continue;}else{takeProducts(c,f);act(c,'take',f);c.bubble='✓ '+p.name.split(' ·')[0];}}
if(c.cart.length>=c.wants||Math.random()<.10){if(c.cart.length){if(c.thief){c.bubble='…';c.state='steal';c.path=path(c.x,c.y,12,16);}else queue(c);}else leave(c,false);}else{let a=S.furniture.filter(f=>FURN[f.kind].type&&f.qty>0);if(!a.length||!route(c,preferredFixture(c,a))){if(c.cart.length)queue(c);else leave(c,false);}}}
if(c.state==='queue'){let first=readyCustomer(c.target);if(first===c&&(c.target.kind==='self'||(S.staff.cashier&&!playerAtCheckout(c.target)&&pendingCheckout!==c.target))&&c.think>(c.target.kind==='self'?5/(1+.25*(c.target.tier||0)):3/(1+.3*(c.target.tier||0))))purchase(c);}
if(c.state==='steal'&&distance(c,{x:12,y:16})<.3){S.rating=Math.max(10,S.rating-1);S.lost++;recordRetailTheft(c);toast('Diebstahl! Ware verloren. Sicherheit einstellen oder mit E ansprechen.');c.done=true;}
if(c.state==='leave'&&distance(c,{x:12,y:16})<.3){c.done=true;if(S.furniture.some(f=>f.kind==='deposit'))S.deposits+=1+Math.floor(Math.random()*3);if(Math.random()<.12)S.trash.push({x:layout().shop[0]+Math.floor(Math.random()*(layout().shop[2]-layout().shop[0]+1)),y:13});}}

if(auto>12){auto=0;save();}hud();}
function broomPoint(state=S){const base=STAGES[state.expanded],a=warehouseAnchor(state);return warehouseObjectPoint('broom',state,{x:a.x,y:base.door+1});}

function paymentNeedle(p=payment){const n=(p.clock*.65)%2;return n<=1?n:2-n;}
function checkoutPanel(c){if(!c||c.state!=='queue'||readyCustomer(c.target)!==c)return;selection=c;payment={customer:c,phase:c.payment==='Bar'?'cash':'card',clock:0,uiClock:0,target:.5,width:.22+.04*(c.target.tier||0),scanned:0,cardHits:0,totalCents:c.cart.reduce((sum,id)=>sum+Math.round(S.prices[id]*100),0),givenCents:0,counts:PAYMENT_COINS.map(()=>0),choice:0,cashMode:'keypad',cashStep:'change',cashEntry:'',padChoice:0,repeat:0,direction:'',cool:0,message:'Drücke A, wenn der Zeiger im grünen Bereich steht.'};currentPanel='payment';if(c.payment==='Bar')startCashPayment();else renderPayment();}
function startCashPayment(){const p=payment;if(!p||p.customer.payment!=='Bar'||p.customer.state!=='queue'||readyCustomer(p.customer.target)!==p.customer)return;p.phase='cash';p.scanned=p.customer.cart.length;p.givenCents=Math.ceil((p.totalCents+1)/500)*500;p.cool=0;p.cashMode='keypad';p.cashStep='change';p.cashEntry='';p.padChoice=0;p.message='Nur den Wechselbetrag eingeben und Auszahlen drücken.';renderPayment();}
function renderPayment(){const p=payment;if(!p)return;currentPanel='payment';const c=p.customer,amount=money(p.totalCents/100);let content=`<div class="payment-summary"><span>${c.payment==='Bar'?'Bargeld':'EC-Karte'} · ${c.cart.length} Artikel</span><b>${amount}</b></div>`;if(p.phase==='card'){content+=`<div class="payment-game"><span class="game-step">KARTENZAHLUNG</span><h3>Gesamten Einkauf bezahlen</h3><p>${c.cart.length} Artikel · ein Treffer für ${amount}</p><div class="timing-track"><span id="paymentZone" class="timing-zone" style="left:${(p.target-p.width/2)*100}%;width:${p.width*100}%"></span><span id="paymentNeedle" class="timing-needle"></span></div><p class="sub">Einmal A / E im grünen Bereich drücken. Der Treffer bezahlt den gesamten Einkauf.</p></div>`;}else if(p.cashMode==='keypad'){content+=cashKeypadHTML();}else{content+=`<div class="payment-game"><span class="game-step">2 · RÜCKGELD</span><p>Erhalten: <b>${money(p.givenCents/100)}</b> · Einkauf: <b>${amount}</b></p><div class="change-total">Rückgeld: <b>${money((p.givenCents-p.totalCents)/100)}</b><br>Zusammengestellt: <b id="changeTotal">0,00 €</b></div><div class="cash-coins">${PAYMENT_COINS.map((value,i)=>`<div id="cashChoice${i}" class="cash-choice" role="button" onclick="selectCashCoin(${i})"><strong>${money(value/100)}</strong><small id="cashCount${i}">0 ×</small></div>`).join('')}<div id="cashChoice8" class="cash-choice cash-command" role="button" onclick="cashCommand(8)">Leeren</div><div id="cashChoice9" class="cash-choice cash-command" role="button" onclick="cashCommand(9)">Ausgeben</div></div><button type="button" onclick="openCashKeypad()">▦ Kassen-Numpad öffnen</button><p class="sub">Münzen antippen oder ← → wählen und A hinzufügen. Rückgeld passend? Noch einmal A zum Bezahlen. ↓ entfernt eine Münze.</p></div>`;}content+='<p id="paymentStatus" class="payment-status" role="status"></p><p class="sub">B bricht ohne Abbuchung ab; der Kunde wartet weiter.</p>';show('Bezahlspiel · '+c.profile,content);refreshPaymentUI();}
function refreshPaymentUI(){const p=payment;if(!p)return;if(p.phase==='cash'&&p.cashMode==='keypad'){refreshCashKeypad();return;}$('paymentStatus').textContent=p.phase==='cash'&&cashReady()?'Rückgeld stimmt · A zum Bezahlen.':p.message;if(p.phase==='cash'){const sum=p.counts.reduce((n,count,i)=>n+count*PAYMENT_COINS[i],0);$('changeTotal').textContent=money(sum/100);for(let i=0;i<10;i++){const e=$('cashChoice'+i);if(e){e.classList.toggle('cash-selected',i===p.choice);if(i===p.choice&&p.lastChoice!==p.choice)e.scrollIntoView({block:'nearest'});}if(i<8)$('cashCount'+i).textContent=p.counts[i]+' ×';}p.lastChoice=p.choice;$('actionLabel').textContent=cashReady()?'Bezahlen':'Münze';$('interact').setAttribute('aria-label',$('actionLabel').textContent+' · A oder E');}else{$('paymentNeedle').style.left=paymentNeedle(p)*100+'%';}}
function adjustCash(delta){const p=payment;if(!p||p.phase!=='cash'||p.choice>=8)return;p.counts[p.choice]=Math.max(0,Math.min(100,p.counts[p.choice]+delta));p.message='Münzen antippen oder mit ← → wählen und A hinzufügen.';refreshPaymentUI();}
const CASH_PAD=['7','8','9','4','5','6','1','2','3',',','0','back','clear','confirm','coins'];
function cashEntryCents(p=payment){if(!p||!/^[0-9]{1,5}(,[0-9]{0,2})?$/.test(p.cashEntry))return null;const [euros,cents='']=p.cashEntry.split(',');return Number(euros)*100+Number(cents.padEnd(2,'0'));}


function cashKey(key){const p=payment;if(!p||p.phase!=='cash'||p.cashMode!=='keypad')return;const keyIndex=CASH_PAD.indexOf(key);if(keyIndex>=0)p.padChoice=keyIndex;if(key==='coins'){p.cashMode='coins';p.choice=0;p.message='Münzen antippen oder mit links/rechts auswählen.';renderPayment();return;}if(key==='confirm'){const cents=cashEntryCents(p);if(cents===null){p.message='Bitte zuerst einen Betrag eingeben.';refreshPaymentUI();return;}if(cents!==p.givenCents-p.totalCents){p.message='Das Rückgeld stimmt noch nicht. Benötigt: '+money((p.givenCents-p.totalCents)/100)+'.';refreshPaymentUI();return;}p.authorized=true;finishPayment();return;}if(key==='clear')p.cashEntry='';else if(key==='back')p.cashEntry=p.cashEntry.slice(0,-1);else if(key===','){if(!p.cashEntry.includes(','))p.cashEntry=(p.cashEntry||'0')+',';}else if(/^[0-9]$/.test(key)){let next=p.cashEntry==='0'?key:p.cashEntry+key;if(/^[0-9]{0,5}(,[0-9]{0,2})?$/.test(next))p.cashEntry=next;}else return;p.message='Wechselbetrag eingeben und Auszahlen drücken.';refreshPaymentUI();}
function openCashKeypad(){if(!payment||payment.phase!=='cash')return;payment.cashMode='keypad';payment.cashStep='change';payment.cashEntry='';payment.padChoice=0;payment.message='Nur den Wechselbetrag eingeben und Auszahlen drücken.';renderPayment();}
function cashSum(p=payment){return p.cashMode==='keypad'?(cashEntryCents(p)??0):p.counts.reduce((n,count,i)=>n+count*PAYMENT_COINS[i],0);}
function cashReady(){return !!payment&&payment.phase==='cash'&&(payment.cashMode!=='keypad'||(payment.cashStep==='change'&&cashEntryCents()!==null))&&cashSum()===payment.givenCents-payment.totalCents;}
function selectCashCoin(i){if(!payment||payment.phase!=='cash'||!Number.isInteger(i)||i<0||i>=PAYMENT_COINS.length)return;payment.choice=i;adjustCash(1);}
function cashCommand(choice){if(!payment||payment.phase!=='cash')return;if(choice===8){payment.counts=PAYMENT_COINS.map(()=>0);payment.message='Rückgeld zurückgesetzt.';refreshPaymentUI();return;}if(choice===9){if(cashReady()){payment.authorized=true;finishPayment();return;}const difference=payment.givenCents-payment.totalCents-cashSum();payment.message=difference>0?'Es fehlen noch '+money(difference/100)+'.':'Das sind '+money(-difference/100)+' zu viel.';refreshPaymentUI();}}
function paymentInput(){const p=payment;if(!p||p.cool>0)return;if(p.phase==='cash'){if(p.cashMode==='keypad'){if(cashReady())cashKey('confirm');else cashKey(CASH_PAD[p.padChoice]);return;}if(cashReady()){p.authorized=true;finishPayment();return;}if(p.choice<8)adjustCash(1);else cashCommand(p.choice);return;}
if(p.phase!=='card')return;if(Math.abs(paymentNeedle(p)-p.target)>p.width/2){p.cool=.3;p.message='Noch einmal: A drücken, sobald der Zeiger im grünen Bereich steht.';refreshPaymentUI();return;}p.cardHits=1;p.authorized=true;finishPayment();}

function updatePayment(dt){const p=payment;if(!p||!$('modal').open||document.hidden)return;p.clock+=dt;p.cool=Math.max(0,p.cool-dt);p.uiClock+=dt;if(p.phase==='cash'){const dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),direction=dx+','+dy;if(!dx&&!dy){p.repeat=0;p.direction='';}else{p.repeat-=dt;if(direction!==p.direction||p.repeat<=0){p.direction=direction;p.repeat=.16;if(p.cashMode==='keypad'){const row=Math.floor(p.padChoice/3),col=p.padChoice%3;p.padChoice=Math.max(0,Math.min(4,row+dy))*3+Math.max(0,Math.min(2,col+dx));}else if(dx)p.choice=(Math.min(p.choice,7)+dx+8)%8;else adjustCash(-dy);refreshPaymentUI();}}}if(p.uiClock>=1/30){p.uiClock=0;refreshPaymentUI();}}
function finishPayment(){const p=payment;if(!p||!p.authorized)return;payment=null;if(p.customer.state!=='queue'||readyCustomer(p.customer.target)!==p.customer){closePanel();toast('Dieser Verkauf ist nicht mehr aktiv.');return;}purchase(p.customer);closePanel();}
function abortPayment(){if(!payment)return;payment=null;closePanel();toast('Bezahlspiel abgebrochen · keine Abbuchung, Kunde wartet weiter.');}

function chooseShelfProduct(id){const f=selection,p=PRODUCTS[id];if(!S.furniture.includes(f)||!p||!unlocked(p)||p.type!==FURN[f.kind]?.type||(f.kind==='coffee'&&id>=170)){toast('Dieses Produkt passt nicht in das Möbel.');return;}S.stock[f.pid]+=f.qty;f.qty=0;f.pid=id;refill(f);save();shelfPanel(f);focusShelfProduct(id);toast(p.name+' zugeordnet · '+f.qty+' Stück eingeräumt.');}
function navigateProductGrid(dx,dy){const list=menuTargets();if(!list.length)return;let columns=window.innerWidth&&window.innerWidth<=560?2:4;const grid=$('productGrid');if(grid&&typeof getComputedStyle==='function'){const tracks=getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean);if(tracks.length>1)columns=tracks.length;}const row=Math.floor(menuFocus/columns),col=menuFocus%columns,rows=Math.ceil(list.length/columns);let next;if(dy){const nr=Math.max(0,Math.min(rows-1,row+dy));next=Math.min(nr*columns+col,list.length-1);}else{next=row*columns+Math.max(0,Math.min(Math.min(columns-1,list.length-1-row*columns),col+dx));}focusMenu(next);}
function fillAndClose(){const success=refill(selection);closePanel();toast(success?'Ware wird eingeräumt.':'Keine passende Ware im Lager oder Möbel bereits voll.');}

function basePanel(name){pendingCheckout=null;payment=null;currentPanel=name;if(name==='menu'){show('HYPERMARKT · Spielmenü · 2.2',`<div class="notice">${editing()?'Möbelmodus aktiv · Menü schließen, um den Cursor weiterzubewegen.':'WASD / Pfeile: bewegen · Leertaste / E: interagieren · Q: Menü'}</div><div class="game-menu"><button id="openBtn" onclick="S.open=!S.open;hud();panel('menu')">${S.open?'● Laden schließen':'○ Laden öffnen'}<small>Kunden empfangen oder Einlass stoppen</small></button><button id="pauseBtn" onclick="S.paused=!S.paused;hud();panel('menu')">${S.paused?'▶ Fortsetzen':'Ⅱ Pause'}<small>Simulation anhalten oder fortsetzen</small></button><button onclick="panel('supply')">▣ Einkauf & Import<small>Neue Ware und Lieferungen</small></button><button onclick="panel('products')">€ Preise einstellen<small>Sortiment · A bearbeiten · ↑ ↓ ändern</small></button><button onclick="panel('build')">▦ Möbel kaufen & Ausbau<small>WASD setzt den Möbelcursor</small></button><button id="moveBtn" onclick="startMoveMode()">↔ Möbel verschieben<small>WASD wählen · A aufnehmen und abstellen</small></button><button onclick="panel('staff')">♙ Mitarbeitende<small>Personal einstellen und verwalten</small></button><button onclick="panel('career')">Ladenbuch<small>Aufträge, Ränge und Belohnungen</small></button><button onclick="panel('suppliers')">Lieferanten<small>Beziehungen, Rabatte und Lieferzeiten</small></button><button onclick="panel('regulars')">Stammkunden<small>Bindung und besondere Wünsche</small></button><button onclick="panel('upgrades')">Ausstattung<small>Mehr Kapazität und Automatisierung</small></button><button onclick="panel('storage')">Lagerbestand<small>Vorrat, Auslagen und Lieferungen</small></button><button onclick="panel('goals')">Sortiment-Freigaben<small>Weitere Produkte freischalten</small></button><button onclick="panel('manage')">⚙ Management & Spielstand<small>Speichern, Export und Import</small></button><button onclick="panel('help')">? Spielhilfe<sm else if(name==='build'){show('Möbel & Ladenausbau',`<button onclick="startMoveMode()">↔ Vorhandene Möbel kostenlos verschieben</button><p class="sub">Das Bauraster ist halb so breit und halb so tief. Regale und Kühlmöbel belegen 2 × 1 kleine Felder und stehen bündig an der Rückwand. Möbel auswählen, mit WASD / Steuerkreuz ein freies Feld wählen und A / E drücken. B / Escape bricht ab. Laufwege und der Zugang zu allen Möbeln bleiben frei.</p><div class="cards">${Object.entries(FURN).map(([k,f])=>`<div class="card"><h3>${f.name}</h3>${k==='oven'?'':'<small>'+fixtureGridLabel({kind:k,x:0,y:0,rot:0})+'</small>'}<p>${f.type?(k==='coffee'?'6–12 fertige Tassen · Bohnen nachfüllen.':'24–48 Plätze · '+({shelf:'Trockenware',cold:'Kühlprodukte',frozen:'Tiefkühlprodukte',bakery:'Brötchen und Croissants'}[f.type])):k==='oven'?'Fester Einbau im Lager · aus Rohlingen frische Backwaren herstellen.':k==='standing'?'Ein Gast pro Tisch · nach der Pause Geschirr abräumen.':k==='self'?'Bedient Kunden selbstständig.':k==='checkout'?'Fünf belegte Felder mit seitlichem Kassenterminal. Mit R oder über Menü drehbar.':k==='deposit'?'Kunden geben Flaschen zurück. Pfandservice per E abrechnen.':k==='bin'?'Abfälle mit E entsorgen.':'Dekoration für deinen Shop.'}</p><button ${(S.money<f.cost&&!(k==='oven'&&S.food.oven.installed))||careerRank()<buildingRank(k)?'disabled':''} onclick="startBuild('${k}')">${k==='oven'&&S.food.oven.installed?'Ofen bedienen':careerRank()<buildingRank(k)?'Ab Rang '+(buildingRank(k)+1):money(f.cost)+(k==='oven'?' · Im Lager einbauen':' · Platzieren')}</button></div>`).join('')}<div class="card"><h3>${layout().name} · Stufe ${S.expanded+1}/4</h3><p>Verkaufsfläche: ${4*(layout().shop[2]-layout().shop[0]+1)*(layout().shop[3]-layout().shop[1]+1)} kleine Felder.<br>${STAGES[S.expanded+1]?'Nächster Ausbau: '+STAGES[S.expanded+1].name+'. Zusätzliche Fläche und größeres Lager; vorhandene Möbel bleiben stehen.':'Maximale Ladengröße erreicht.'}</p><button ${!STAGES[S.expanded+1]||!expansionReady()||S.money<STAGES[S.expanded+1].cost?'disabled':''} onclick="expand()">${STAGES[S.expanded+1]?(expansionReady()?money(STAGES[S.expanded+1].cost)+' · Ausbauen':'Benötigt Rang '+([0,2,4,6][S.expanded+1]+1)):'Vollständig ausgebaut'}</button></div></div>`);}

else if(name==='goals'){show('Erfolge & neue Sortimente',`<p class="sub">10 Startprodukte. Je 12 verkaufte Artikel schaltest du zehn weitere Produkte frei. Insgesamt 160 Artikel.</p><div class="cards">${Array.from({length:16},(_,i)=>`<div class="card"><h3>${S.sales>=i*12?'✓':'◇'} ${i===0?'Grundsortiment':'Sortimentsstufe '+i}</h3><p>${i*12} Verkäufe · ${i===0?'Startprodukte':VARIANTS[i]+'-Sortiment'}</p><progress value="${Math.min(S.sales,i*12)||1}" max="${i*12||1}" style="width:100%;accent-color:#237562"></progress></div>`).join('')}</div>`);}
else if(name==='manage'){show('Shop-Management & Spielstand',`<div class="cards"><div class="card"><h3>Dein Geschäft</h3><p>Umsatz: ${money(S.revenue)}<br>Bediente Kunden: ${S.served}<br>Unzufrieden / Diebstahl: ${S.lost}<br>Diebstähle verhindert: ${S.stopped}<br>Schmutzstellen: ${S.trash.length}<br>Lieferungen unterwegs: ${S.orders.length}<br>Kartons im Lager: ${S.crates.length}</p></div><div class="card"><h3>Speicherstand</h3><p>Automatische lokale Speicherung alle 12 Sekunden. Export sichert deinen Fortschritt als JSON-Datei.</p><button onclick="if(save())toast('Gespeichert.')">Speichern</button> <button onclick="exportSave()">Export</button> <button onclick="document.getElementById('loadFile').click()">Import</button><p><button onclick="resetPanel()">Neues Spiel …</button></p></div></div><h3>Shop-Chronik</h3><div id="logs"></div>`);$('logs').textContent=S.log.join('\n');$('logs').style.whiteSpace='pre-line';}
else if(name==='help'){show('Willkommen in deinem HYPERMARKT',`<p class="sub">Vom Kiosk zum Lieblingsmarkt. Öffne im Menü das Ladenbuch: Aufträge geben Geld und Erfahrung. Jeder Rang schaltet neue Ausstattung frei. Lieferanten werden durch angenommene Bestellungen besser, Nachbarn nach drei Einkäufen zu Stammkunden. Starte mit 2.600 €, einem Kiosk mit 140 kleinen Verkaufsfeldern, zwei Regalen, einer Getränkekühlung und einer Kasse. Zehn Produkte stehen im Einkauf zur Verfügung. Weitere Möbel kaufst du selbst.</p><div class="cards"><div class="card"><h3>1 · Türen öffnen</h3><p>Unten mittig MENÜ öffnen und „Laden öffnen“ wählen. 20 Kundenprofile haben unterschiedliche Preisgrenzen, Einkaufsgrößen und Geduld. Über den Köpfen siehst du Wünsche und Reaktionen.</p></div><div class="card"><h3>2 · Verkaufen</h3><p>Mit Steuerkreuz oder WASD zum Fußsymbol hinter der Kasse laufen. E oder die runde A-Taste öffnet das Kassen-Numpad oder die Kartenleiste für den gesamten Einkauf. Bei Bargeld nur den Wechselbetrag am Numpad eingeben und Auszahlen drücken. Bei Kartenzahlung einmal den grünen Bereich treffen; das bezahlt alle Artikel.</p></div><div class="card"><h3>3 · Ware nachlegen</h3><p>Zum Putzen den Besen an der Halterung im Lager mit E / A mitnehmen. Mit Besen wischt E / A Schmutz statt zu kassieren. Anschließend den Besen dort zurücklegen. Mit A / E am Möbel auffüllen oder Produkt wechseln. Einkauf bestellt neue Ware. Das Lager ist rechts: am Kartonstapel mit A / E annehmen.</p></div><div class="card"><h3>4 · Wachsen</h3><p>Vom Kiosk über Nachbarschaftsladen und Mini-Markt zum Supermarkt wachsen. Ausbau kostet 1.800 €, 4.500 € und 9.000 €. Im unteren Menü Möbel kaufen oder verschieben wählen. WASD / Steuerkreuz bewegt den Cursor; A / E nimmt Möbel auf und stellt sie ab. B / Escape bricht ab. Mitarbeiter automatisieren Aufgaben. Je höher dein Rang, desto mehr Berufe stehen bereit. Möbel aufwerten erhöht Kapazitäten und spart später Handarbeit. Im Ladenbuch stehen Tagesaufträg let customerAtlas=null,customersReady=false;const customerFrames=new Map();
const CUSTOMER_PROFILE_DESIGNS=Array.from({length:28},(_,i)=>i);
function loadCustomerAtlas(uri){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{for(const [name,[x,y,w,h]]of Object.entries(CUSTOMER_FRAMES))if(x<0||y<0||w<=0||h!==128||x+w>image.width||y+h>image.height){reject(new Error('Kunden-Asset unvollständig: '+name));return;}customerAtlas=image;customersReady=true;customerFrames.clear();pixelAssets.clear();resolve();};image.onerror=()=>reject(new Error('Kunden-Assets konnten nicht geladen werden.'));image.src=uri;});}
function customerDesign(look){return CUSTOMER_PROFILE_DESIGNS[(Math.max(1,look)-1)%CUSTOMER_PROFILE_DESIGNS.length];}
function customerFrame(look,dir){
 const key='customer'+customerDesign(look)+({up:'Up',down:'Down',left:'Left',right:'Right'}[dir]||'Down');
 if(customerFrames.has(key))return customerFrames.get(key);
 const [x,y,w,h]=CUSTOMER_FRAMES[key],c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(customerAtlas,x,y,w,h,0,0,w,h);customerFrames.set(key,c);return c;
}
function detailedCustomer(look,dir,step,kind){
 const identity=customerDesign(look),source=customerFrame(look,dir);
 return pixelStamp(['detailed-customer',identity,dir,step,kind].join('/'),72,104,(_,g)=>{
  const h=96,w=Math.round(source.width*h/source.height),left=Math.round((72-w)/2),split=Math.floor(source.height*.77),bodyH=Math.floor(h*.77),stride=[0,2,0,-2][step];
  g.drawImage(source,0,0,source.width,split,left,4,w,bodyH);
  for(let side=0;side<2;side++){const sx=Math.floor(source.width*side/2),sw=Math.floor(source.width*(side+1)/2)-sx,dw=Math.floor(w*(side+1)/2)-Math.floor(w*side/2);g.drawImage(source,sx,split,sw,source.height-split,left+Math.floor(w*side/2),4+bodyH+Math.max(0,stride*(side?1:-1)),dw,h-bodyH);}
 });
}

const SIGN_FONT={'.':[0,0,0,0,2],K:[5,6,4,6,5],A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],H:[5,5,7,5,5],I:[7,2,2,2,7],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[5,7,7,7,5],O:[2,5,5,5,2],P:[6,5,6,4,4],R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],W:[5,5,7,7,5],Z:[7,1,2,4,7]};
function signText(text,x,y){ctx.fillStyle='#344c53';let left=Math.round(x-(text.length*4-1)/2);for(const ch of text){const rows=SIGN_FONT[ch]||SIGN_FONT.I;for(let row=0;row<5;row++)for(let col=0;col<3;col++)if(rows[row]&(1<<(2-col)))ctx.fillRect(left+col,y-5+row,1,1);left+=4;}}
function loadMerchAtlas(uri){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{for(const [x,y,w,h]of Object.values(MERCH_FRAMES))if(x<0||y<0||w<=0||h<=0||x+w>image.width||y+h>image.height){reject(new Error('Produktbild unvollständig.'));return;}merchAtlas=image;merchReady=true;merchFrames.clear();merchIcons.clear();resolve();};image.onerror=()=>reject(new Error('Produktbilder konnten nicht geladen werden.'));image.src=uri;});}
function merchFrame(id){const type=id%10;if(merchFrames.has(type))return merchFrames.get(type);const [x,y,w,h]=MERCH_FRAMES['product'+type],c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(merchAtlas,x,y,w,h,0,0,w,h);merchFrames.set(type,c);return c;}
function drawMerchProduct(id,x,y,w,h){const source=merchFrame(id),scale=Math.min(w/source.width,h/source.height),dw=source.width*scale,dh=source.height*scale;ctx.imageSmoothingEnabled=false;ctx.drawImage(source,Math.round((x+(w-dw)/2)*2)/2,Math.round((y+h-dh)*2)/2,dw,dh);}

function rankSummary(){const rank=careerRank(),next=CAREER_RANKS[rank+1],floor=CAREER_RANKS[rank].xp,range=next?next.xp-floor:1,value=next?S.career.xp-floor:1;return`<div class="rank-banner"><span class="pixel-badge">${rank+1}</span><div><small>LADENRANG ${rank+1} / ${CAREER_RANKS.length}</small><h3>${CAREER_RANKS[rank].name}</h3><progress value="${value}" max="${range}"></progress><p>${next?S.career.xp+' / '+next.xp+' EP · Nächster Rang: '+next.name:'Meisterrang erreicht · '+S.career.xp+' EP'}</p><small>${CAREER_RANKS[rank].perk}</small></div></div>`;}

${m.id}')">${done?'Erledigt':!available?'Vorherigen Auftrag abschließen':'Belohnung abholen'}</button></div>`;}).join('')}</div>`;}
function suppliersHTML(){return`<p class="sub">Eine Bestellung umfasst 12 Stück. Beziehungsstufen steigen durch tatsächlich angenommene Lieferkartons. Stufe 1/2/3/4: jeweils 3 % mehr Rabatt und 10 % kürzere Grundlieferzeit. Engpässe werden beim Bestellen berücksichtigt.</p><div class="cards">${SUPPLIERS.map((s,i)=>{const tier=supplierTier(i),count=S.career.supplierDeliveries[i],available=supplierAvailable(i);return`<div class="card supplier ${S.career.supplier===i?'selected-supplier':''}"><span class="supplier-stamp" style="--stamp:${s.color}"></span><span class="eyebrow">${s.tag} · STUFE ${tier}</span><h3>${s.name}</h3><p>${s.description}</p><p>${count} Kartons angenommen · ${tier<4?'nächste Stufe bei '+SUPPLIER_STEPS[tier+1]:'Meisterbeziehung'}</p><p>${Math.round((1-s.factor*(1-tier*.03))*100)} % Preisvorteil zum Listenpreis · ${Math.ceil(s.seconds*(1-tier*.1))} s Grundlieferzeit</p><button ${!available?'disabled':''} onclick="chooseSupplier(${i})">${available?(S.career.supplier===i?'Ausgewählt':'Als Lieferant wählen'):'Ab Ladenrang '+(s.rank+1)}</button></div>`;}).join('')}</div><button class="primary" onclick="panel('supply')">Waren bestellen</button>`;}

function freshFood(){return{version:1,oven:{installed:false,recipe:162,choice:12,auto:false,batch:null},reserve:200,baked:0,coffeeSold:0,tablesCleared:0};}
function normalizeFood(state,raw){
 const f=raw.food;
 if(!f){state.food=freshFood();}else{
  if(f.version!==1||!Number.isFinite(f.reserve)||f.reserve<0||f.reserve>1e7||!f.oven||typeof f.oven.installed!=='boolean'||typeof f.oven.auto!=='boolean'||!FOOD_RECIPES[f.oven.recipe]||![6,12,24].includes(f.oven.choice))throw Error('Ungültige Café-Einstellungen');
  for(const key of ['baked','coffeeSold','tablesCleared'])if(!Number.isInteger(f[key])||f[key]<0)throw Error('Ungültiger Café-Fortschritt');
  const batch=f.oven.batch;
  if(batch&&(!f.oven.installed||!FOOD_RECIPES[batch.pid]||![6,12,24].includes(batch.qty)||!Number.isFinite(batch.remaining)||!Number.isFinite(batch.total)||batch.total<=0||batch.remaining<0||batch.remaining>batch.total||batch.total>120))throw Error('Ungültige Ofenladung');
  state.food={...f,oven:{...f.oven,batch:batch?{...batch}:null}};
 }
 for(const fixture of state.furniture){
  if(fixture.autoOrder!==undefined&&typeof fixture.autoOrder!=='boolean')throw Error('Ungültige Nachbestellung');
  if(fixture.kind==='coffee'){
   if(fixture.beans!==undefined&&(!Number.isInteger(fixture.beans)||fixture.beans<0||fixture.beans>24))throw Error('Ungültiger Bohnenvorrat');
   fixture.beans=fixture.beans||0;fixture.brew=0;
  }
  if(fixture.kind==='standing'){if(fixture.dirty!==undefined&&(!Number.isInteger(fixture.dirty)||fixture.dirty<0||fixture.dirty>20))throw Error('Ungültiger Tischzustand');fixture.dirty=fixture.dirty||0;}
 }
 if(state.food.oven.installed&&ovenCollision(state.player.x,state.player.y,state))state.player={...storagePointFor(state)};
 return state;
}

function ovenCollision(x,y,state=S){if(!state.food?.oven?.installed)return false;const p=ovenPoint(state),cx=x+.5,cy=y+.70;return cx+.27>p.x-.04&&cx-.27<p.x+1.04&&cy+.16>p.y+.08&&cy-.16<p.y+.93;}

function foodSupplyPid(f){return FOOD_RECIPES[f.pid]?.raw??(f.kind==='coffee'?161:f.pid);}
function stockCoverage(id){
 let quantity=S.stock[id]||0;
 for(const o of [...S.orders,...S.crates])if(o.pid===id)quantity+=o.qty;
 for(const f of S.furniture)if(FURN[f.kind].type&&foodSupplyPid(f)===id)quantity+=(f.qty||0)+(f.kind==='coffee'?f.beans||0:0);
 if(id===161)quantity+=S.stock[163]||0;
 for(const [pid,recipe]of Object.entries(FOOD_RECIPES))if(recipe.raw===id)quantity+=S.stock[pid]||0;

 return quantity;
}

 return{id,quantity,q,low,target:capacity+12,reason:quantity>low?'Vorrat reicht':id>=140&&id<160&&q.supplier!==2?'Goldblatt auswählen':!supplierAvailable(q.supplier)?'Lieferant gesperrt':S.money-q.cost<S.food.reserve?'Geldreserve schützt die Kasse':'Bestellt beim nächsten Warencheck'};
}

 for(const f of S.furniture){if(!FURN[f.kind].type||!f.autoOrder)continue;const info=autoSupplyStatus(f);if(handled.has(info.id))continue;handled.add(info.id);
  if(info.quantity>info.low||!supplierAvailable(info.q.supplier)||(info.id>=140&&info.id<160&&info.q.supplier!==2))continue;
  const count=Math.ceil((info.target-info.quantity)/12);

 }

 if(f.kind==='bakery'){const amount=Math.ceil(Math.min(24,f.qty)/2);for(let i=0;i<amount;i++){const row=Math.floor(i/4),col=i%4;drawFood(foodProductKey(f.pid),x+7+col*8,top+15+row*13,8,9);}}
 else{if(f.brew&&f.beans&&f.qty<furnitureCapacity(f)){rect(x+16,top+29,2,3,PX.cream);rect(x+19,top+25,2,3,PX.cream);}for(let i=0;i<Math.min(4,f.qty);i++)drawFood('cup',x+4+i*9,top+35,8,10);rect(x+31,top+9,3,3,(f.beans||0)>0?'#88af71':'#bd6652');}
 if(labels&&furnitureDistance(S.player,f)<1.35){rect(x+7,y+T+1,T-14,10,'#34494c');textAt(f.qty+'/'+furnitureCapacity(f),x+23,y+T+8,'#fff5db',7);}

function freshBusiness(openingMoney=2600){return{version:1,phase:'trading',openingMoney:roundMoney(openingMoney),otherIncome:0,otherExpenses:0,report:null};}
function normalizeBusiness(state,raw){
 for(const f of state.furniture)if(rotatableFurniture(f.kind)){if(f.rot!==undefined&&(!Number.isInteger(f.rot)||f.rot<0||f.rot>3))throw Error('Ungültige Möbelausrichtung');f.rot=f.rot||0;}
 if(state.time>BUSINESS_HOURS.duration||state.day<1||!Number.isInteger(state.day))throw Error('Ungültige Geschäftszeit');
 if(!raw.business){const e=state.economy;state.business=freshBusiness(state.money-e.revenue+e.purchases+e.wages+e.utilities);return state;}
 const b=raw.business,report=b.report;
 if(b.version!==1||!['trading','report','afterhours'].includes(b.phase)||!Number.isFinite(b.openingMoney)||!['otherIncome','otherExpenses'].every(k=>Number.isFinite(b[k])&&b[k]>=0))throw Error('Ungültiger Kassenstand');
 if(report&&(!Number.isInteger(report.day)||report.day<1||!['openingMoney','closingMoney','revenue','goods','purchases','wages','utilities','otherIncome','otherExpenses','income','expenses','customers','items','profit','cashflow','adjustment'].every(k=>Number.isFinite(report[k]))||!['revenue','goods','purchases','wages','utilities','otherIncome','otherExpenses','income','expenses','customers','items'].every(k=>report[k]>=0)||Math.abs(roundMoney(report.income-report.expenses)-report.cashflow)>.011||Math.abs(roundMoney(report.closingMoney-report.openingMoney)-report.cashflow)>.011))throw Error('Ungültiger Kassenbericht');
 if(b.phase!=='trading'&&(!report||report.day!==state.day||state.time!==BUSINESS_HOURS.duration))throw Error('Unvollständiger Tagesabschluss');
 if(report&&report.day>state.day)throw Error('Ungültiger Berichtstag');
 state.business={version:1,phase:b.phase,openingMoney:b.openingMoney,otherIncome:b.otherIncome,otherExpenses:b.otherExpenses,report:report?{...report}:null};if(b.phase!=='trading')state.open=false;return state;
}

function cashOperation(fn,args=[],incomeOnly=false){const before=S.money,revenue=S.economy.revenue,result=fn(...args),delta=roundMoney(S.money-before-(incomeOnly?S.economy.revenue-revenue:0));if(delta){const b=S.business;if(delta>0)b.otherIncome=roundMoney(b.otherIncome+delta);else if(!incomeOnly)b.otherExpenses=roundMoney(b.otherExpenses-delta);save();}return result;}
function handleWorldClick(p){if(commitWarehouseMove(p))return;if(moveMode&&!moving){const item=warehouseMovables().find(f=>f.x===p.x&&f.y===p.y);if(item){beginWarehouseMove(item);return;}}return cashOperation(v30HandleWorldClick,[p]);}

function interact(){

function businessClock(){const mins=BUSINESS_HOURS.open+Math.floor(Math.min(BUSINESS_HOURS.duration,S.time)/BUSINESS_HOURS.duration*(BUSINESS_HOURS.close-BUSINESS_HOURS.open));return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');}
function closeBusinessDay(){
 if(S.business.phase!=='trading')return;
 // Unpaid baskets return to the warehouse. Paid cafe guests leave dirty tables, never duplicate goods.
 for(const c of customers){if(!c.paid){for(const id of c.cart||[])S.stock[id]++;c.cart=[];}else if(c.table&&S.furniture.includes(c.table))c.table.dirty=Math.max(1,c.table.dirty||0);}
 customers=[];pendingCheckout=null;payment=null;keys={};S.open=false;S.time=BUSINESS_HOURS.duration;
 const e=S.economy,b=S.business,cost=operatingCosts(e.openSeconds);e.wages=cost.wages;e.utilities=cost.utilities;S.money=roundMoney(S.money-cost.wages-cost.utilities);
 const expected=roundMoney(b.openingMoney+e.revenue+b.otherIncome-e.purchases-e.wages-e.utilities-b.otherExpenses),adjustment=roundMoney(S.money-expected);
 const income=roundMoney(e.revenue+b.otherIncome+Math.max(0,adjustment)),expenses=roundMoney(e.purchases+e.wages+e.utilities+b.otherExpenses+Math.max(0,-adjustment));
 const report={day:S.day,openingMoney:b.openingMoney,closingMoney:S.money,revenue:e.revenue,goods:e.goods,purchases:e.purchases,wages:e.wages,utilities:e.utilities,otherIncome:b.otherIncome,otherExpenses:b.otherExpenses,adjustment,income,expenses,customers:e.customers,items:e.items,profit:roundMoney(e.revenue-e.goods-e.wages-e.utilities),cashflow:roundMoney(income-expenses)};
 b.phase='report';b.report=report;e.history=[...e.history.filter(h=>h.day!==S.day),{...report}].slice(-14);
 record('Kassenbericht · 05:00–20:00 · Einnahmen '+money(income)+' · Ausgaben '+money(expenses)+' · Saldo '+money(report.cashflow));save();cashReportPanel();hud();
}
function nextBusinessDay(){
 if(S.business.phase!=='afterhours'||!atDayExit()){toast('Zum Tagesende an den Ladeneingang gehen.');return;}
 refreshClosingReport();const report=S.business.report,history=S.economy.history;S.day++;S.time=0;S.economy={...freshEconomy(S.day),history};S.business={...freshBusiness(S.money),report};S.open=true;S.paused=false;spawn=0;staffTick=0;auto=0;syncCareerDay();closePanel();save();toast('Tag '+S.day+' · 05:00 Uhr · Der Kiosk ist geöffnet.');hud();
}

function update(dt){
 if(departmentSession&&$('modal').open){tickDepartmentProduction(Math.max(0,dt),true);const brew=S.departments.bakery.brew;if(brew&&$('counterBrew'))$('counterBrew').textContent='Zubereitung: '+PRODUCTS[brew.pid].name+' · '+Math.ceil(brew.remaining)+' s';}
 const deptRunning=!S.paused&&!editing()&&!$('modal').open&&S.business.phase!=='report';if(deptRunning){tickDepartmentProduction(Math.max(0,Math.min(dt,.25)));updateDepartmentQueues();}
 if(S.business.phase==='report'){if(!$('modal').open)continueAfterHours();return;}
 if(S.business.phase==='afterhours'){S.open=false;v30Update(Math.max(0,dt));return;}
 repairCheckoutQueues();v30Update(Math.max(0,Math.min(dt,BUSINESS_HOURS.duration-S.time)));if(S.time>=BUSINESS_HOURS.duration)closeBusinessDay();
}

function cashReportPanel(){
 refreshClosingReport();const r=S.business.report;if(!r){toast('Der erste Kassenbericht erscheint um 20:00 Uhr.');return;}
 pendingCheckout=null;payment=null;priceEdit=null;currentPanel='cashReport';
 const row=(label,amount,income=false)=>'<div class="report-row"><span>'+label+'</span><b class="'+(income?'report-income':'')+'">'+(income?'+':'−')+money(amount)+'</b></div>';
 show('Kassenbericht · Tag '+r.day,`<div class="report-heading"><span class="eyebrow">FEIERABEND · 05:00–20:00 UHR</span><h3>Dein Tag im Kiosk</h3><p>${r.customers} Einkäufe · ${r.items} verkaufte Artikel</p></div><div class="report-columns"><section><h3>Einnahmen</h3>${row('Warenverkäufe',r.revenue,true)}${row('Belohnungen, Pfand & Möbelverkauf',r.otherIncome,true)}${r.adjustment>0?row('Weitere Kassenbewegungen',r.adjustment,true):''}<div class="report-row report-total"><span>Gesamt</span><b class="report-income">+${money(r.income)}</b></div></section><section><h3>Ausgaben</h3>${row('Wareneinkauf & Zubereitung',r.purchases)}${row('Löhne',r.wages)}${row('Betrieb & Kühlung',r.utilities)}${row('Möbel, Ausbau & Einstellungen',r.otherExpenses)}${r.adjustment<0?row('Weitere Kassenbewegungen',-r.adjustment):''}<div class="report-row report-total"><span>Gesamt</span><b>−${money(r.expenses)}</b></div></section></div><div class="report-balance ${r.cashflow>=0?'positive':'negative'}"><span>KASSENVERÄNDERUNG</span><strong>${r.cashflow>=0?'+':'−'}${money(Math.abs(r.cashflow))}</strong></div><div class="report-row"><span>Kasse bei Tagesbeginn</span><b>${money(r.openingMoney)}</b></div><div class="report-row"><span>Kasse zum Tagesabschluss</span><b>${money(r.closingMoney)}</b></div><p class="notice">Nach dem Bericht kannst du Lieferungen annehmen, nachbestellen, einräumen und backen. Den Tag beendest du anschließend am Ladeneingang. Nacharbeit wird in diesem Tagesbericht mitgebucht.</p><p class="sub">Wareneinkäufe werden beim Bestellen bezahlt. Der Warenverbrauch wird nicht noch einmal abgezogen. Operativer Gewinn nach Warenverbrauch: ${money(r.profit)}.</p><button class="primary report-next" onclick="${S.business.phase==='report'?'continueAfterHours()':'closePanel()'}">${S.business.phase==='report'?'Nacharbeiten · zurück in den Laden':'Zurück zum Spiel'}</button>`);
}
function panel(name){departmentSession=null;if(name==='departments'){departmentPanel();return;}if(S.business.phase==='report'||name==='cashReport'){cashReportPanel();return;}if(name==='storage'){warehousePanel();return;}if(name==='warehouseMove'){warehouseMovePanel();return;}v30Panel(name);if(name==='menu'&&S.business.phase==='afterhours'){$('openBtn').disabled=true;$('openBtn').textContent='Feierabend · Tag am Eingang beenden';}if(name==='build')$('body').innerHTML='<button class="primary" onclick="departmentPanel()">Verkaufsfläche erweitern · Fleischtheke / Bäckerei & Café</button>'+$('body').innerHTML;if(name==='menu'){$('title').textContent='HYPERMARKT · Spielmenü · 3.15';$('body').innerHTML=$('body').innerHTML.replace('<div class="game-menu">','<p class="business-hours">Öffnungszeiten 05:00–20:00 Uhr · Kassenbericht zum Feierabend</p><div class="game-menu"><button onclick="departmentPanel()">Verkaufsfläche erweitern<small>Fleischtheke / Bäckerei & Café</small></button><button '+(!S.business.report?'disabled':'')+' onclick="panel(\'cashReport\')">Kassenbericht<small>Letzten Tagesabschluss ansehen</small></button>');focusMenu(0);}if(name==='help')$('body').innerHTML='<p class="notice">Im Regalmenü zeigt jede Produktkachel unten den Lagerbestand und oben rechts die Anzahl zugeordneter Regale. Mit Leertaste zuordnen; Esc schließt das Fenster. Nachbestellen steht oben neben Auffüllen und bestellt einen bezahlten 12er-Karton; bei Backwaren Rohlinge, bei Kaffee Bohnen.</p><p class="notice">Öffnungszeiten: 05:00–20:00 Uhr. Um 20 Uhr schließt der Laden mit einem Kassenbericht. Danach bleibt Zeit für Nacharbeit. Den nächsten Tag startest du am Ladeneingang.</p>'+$('body').innerHTML.replace('R: Kasse drehen','R: Regale und Kasse drehen').replace('B / Escape gehen zurück.','Esc schließt Regal und Produktauswahl direkt; B geht eine Ebene zurück.');}
function backAction(){if(currentPanel==='departmentService'&&$('modal').open){closePanel();return;}if(S.business.phase==='report'){continueAfterHours();return;}v30BackAction();}
function hud(){v30Hud();warehouseHud();departmentHud();warehouseEditorHud();$('clock').textContent=S.day+' · '+businessClock();if(editing()&&!moving?.warehouseKey&&FURN[moving?.kind||placing]?.type)$('hint').textContent+=' · '+previewRotation*90+'° · R drehen';if(S.business.phase==='report'){$('worldtag').textContent=layout().name.toUpperCase()+' · FEIERABEND · 20:00 UHR';$('hint').textContent='Kassenbericht · Danach nacharbeiten und den Tag am Eingang beenden';}}
// Keep the sprite upright when a shelf turns: the service face follows the floor direction.
let hideDirectionalSign=false;
function drawProductSign(f,left,top,width){if(!hideDirectionalSign)v30DrawProductSign(f,left,top,width);}
function fixturePolygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(Math.round(x),Math.round(y)):ctx.moveTo(Math.round(x),Math.round(y)));ctx.closePath();ctx.fill();}
const DIRECTIONAL_FRAMES={"shelf1":[28,8,55,128],"shelf2":[117,8,101,128],"shelf3":[252,8,55,128],"cold1":[32,152,47,128],"cold2":[124,152,87,128],"cold3":[257,152,46,128],"frozen1":[6,336,99,88],"frozen2":[116,362,104,62],"frozen3":[230,336,99,88],"bakery1":[32,440,48,128],"bakery2":[117,440,101,128],"bakery3":[255,440,49,128],"coffee1":[21,584,69,128],"coffee2":[130,584,75,128],"coffee3":[245,584,70,128],"bakery0":[5,728,102,128],"oven0":[116,757,104,99],"oven1":[245,728,70,128],"oven2":[4,913,104,87],"oven3":[129,872,78,128]};
// Independently generated cardinal artwork. Never skew or shear a furniture sprite.
function directionalFrame(f){return DIRECTIONAL_FRAMES[f.kind+(f.rot||0)]||null;}
function directionalStockSlots(f){
 const rot=f.rot||0,qty=Math.max(0,f.qty||0),ratio=Math.min(1,qty/furnitureCapacity(f));if(!qty)return[];
 if(f.kind==='bakery'&&rot===0)return Array.from({length:Math.ceil(ratio*16)},(_,i)=>({x:.17+(i%4)*.22,y:.23+Math.floor(i/4)*.22,w:.19,h:.14}));
 if(!rot)return[];
 // In a pure profile, opaque end panels hide the interior. Show only exposed tray edges.
 if(rot===1||rot===3){if(!['shelf','bakery'].includes(f.kind))return[];const levels=f.kind==='bakery'?[.16,.38,.60,.82]:[.10,.31,.53,.74];return Array.from({length:Math.ceil(ratio*4)},(_,i)=>({x:rot===1?.17:.83,y:levels[i],w:.19,h:.10}));}
 if(f.kind!=='frozen')return[];
 return Array.from({length:Math.ceil(ratio*8)},(_,i)=>({x:.19+(i%4)*.20,y:.34+Math.floor(i/4)*.17,w:.12,h:.17}));
}
function drawFixture(f,labels=true){
 if(f.warehouseKey){drawWarehouseMovePreview(f);return;}
 const frame=directionalFrame(f);if(!frame){v30DrawFixture(f,labels);return;}
 // During image loading, keep a clean upright fallback; the next frame uses the real view.
 if(!directionalReady){v30DrawFixture({...f,rot:0},labels);return;}
 const [sx,sy,sw,sh]=frame,x=OX+f.x*T,y=OY+f.y*T,maxHeight=f.kind==='frozen'?T*.74:T*1.39,scale=Math.min((T-3)/sw,maxHeight/sh),width=sw*scale,height=sh*scale,left=x+(T-width)/2,top=y+T-height-2;
 rect(x+5,y+T-3,T-10,4,'#34494c25');ctx.imageSmoothingEnabled=false;ctx.drawImage(directionalAtlas,sx,sy,sw,sh,Math.round(left*2)/2,Math.round(top*2)/2,width,height);
 for(const slot of directionalStockSlots(f))drawProduct(f.pid,left+width*(slot.x-slot.w/2),top+height*(slot.y-slot.h),width*slot.w,height*slot.h);
 drawProductSign(f,left,top,width);
 if(labels&&furnitureDistance(S.player,f)<1.35){rect(x+7,y+T+1,T-14,10,'#34494c');textAt(f.qty+'/'+furnitureCapacity(f),x+23,y+T+8,'#fff5db',7);}
 if(f.tier)rect(left+width-6,top+height-5,3,2,f.tier===2?PX.gold:PX.blue);
 if(editing()){const p=merchandiseFront(f),cx=x+T/2,cy=y+T/2,dx=p.x-f.x,dy=p.y-f.y;fixturePolygon([[cx+dx*22,cy+dy*22],[cx+dx*15-dy*4,cy+dy*15+dx*4],[cx+dx*15+dy*4,cy+dy*15-dx*4]],PX.gold);}
}
let directionalReady=false;
const directionalAtlas=new Image();directionalAtlas.onload=()=>{directionalReady=Object.values(DIRECTIONAL_FRAMES).every(([x,y,w,h])=>x>=0&&y>=0&&w>0&&h>0&&x+w<=directionalAtlas.width&&y+h<=directionalAtlas.height);if(!directionalReady)console.warn('Ungültige Möbelansichten.');};directionalAtlas.onerror=()=>{directionalReady=false;console.warn('Möbelansichten konnten nicht geladen werden.');};directionalAtlas.src='assets/furniture-directions.png';
