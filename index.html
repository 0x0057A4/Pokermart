<script>
'use strict';
// DATEN: Produktkatalog, Kundenprofile und Möbel.
const PRODUCT_NAMES=['Mineralwasser','Apfelsaft','Cola','Milch','Brot','Reis','Nudeln','Chips','Vanilleeis','Tiefkühlpizza'];
const VARIANTS=['Klassik','Bio','Regional','Premium','Familienpack','Leicht','Orange','Zitrone','Erdbeere','Mango','Deluxe','Mini','Vegan','Extra','Edition','Selection'];
const PRODUCTS=Array.from({length:160},(_,i)=>({id:i,name:PRODUCT_NAMES[i%10]+(i<10?'':' · '+VARIANTS[Math.floor(i/10)]),type:i%10<4?'cold':i%10>7?'frozen':'shelf',cost:+((.5+(i%10)*.23)*(1+Math.floor(i/10)*.11)).toFixed(2),unlock:i<10?0:(Math.floor(i/10))*12}));
const PROFILES=['Schüler','Studentin','Pendler','Familie','Seniorin','Sportler','Sparfuchs','Feinschmecker','Nachtarbeiter','Touristin','Büroangestellter','Handwerkerin','Gamer','Umweltfreundin','Eilige Kundin','Großeinkäufer','Nachbar','Sammlerin','Geschäftsreisender','Impulskäufer'];
const FURN={shelf:{name:'Warenregal',cost:180,type:'shelf',sprite:[771,133,118,119]},cold:{name:'Getränkekühlung',cost:350,type:'cold',sprite:[646,30,124,99]},frozen:{name:'Gefriertruhe',cost:450,type:'frozen',sprite:[514,52,125,78]},checkout:{name:'Kassentresen',cost:400,sprite:[813,298,59,85]},self:{name:'Selbstbedienungskasse',cost:900,sprite:[771,259,47,127]},deposit:{name:'Pfandautomat',cost:700,sprite:[515,132,123,122]},plant:{name:'Pflanze',cost:60,sprite:[890,160,49,95]},bin:{name:'Abfallbehälter',cost:60,sprite:null}};
const $=id=>document.getElementById(id),money=v=>v.toLocaleString('de-DE',{style:'currency',currency:'EUR'}),rand=a=>a[Math.floor(Math.random()*a.length)],T=46,OX=48,OY=8;
const STAGES=[
{name:'Kiosk',shop:[8,9,14,13],store:[16,10,18,12],door:11,cost:0},
{name:'Nachbarschaftsladen',shop:[6,7,16,13],store:[18,9,20,12],door:11,cost:1800},
{name:'Mini-Markt',shop:[3,3,18,13],store:[20,4,23,10],door:8,cost:4500},
{name:'Supermarkt',shop:[3,3,20,13],store:[22,4,24,13],door:8,cost:9000}
];
function layout(){return STAGES[S.expanded];}
function storagePoint(){const b=layout().store;return{x:Math.floor((b[0]+b[2])/2),y:Math.floor((b[1]+b[3])/2)};}
function inRect(x,y,b){return x>=b[0]&&y>=b[1]&&x<=b[2]&&y<=b[3];}
function fresh(){return{version:2,wallLayout:2,money:2600,day:1,time:0,open:false,paused:false,sales:0,revenue:0,rating:90,served:0,lost:0,trash:[],orders:[],crates:[],staff:{cashier:0,stocker:0,cleaner:0,security:0},expanded:0,prices:PRODUCTS.map(p=>+(p.cost*1.8).toFixed(2)),stock:PRODUCTS.map((p,i)=>i<10?6:0),furniture:[{kind:'shelf',x:9,y:9,pid:4,qty:8},{kind:'shelf',x:11,y:9,pid:7,qty:8},{kind:'cold',x:13,y:9,pid:0,qty:8},{kind:'checkout',x:10,y:12},{kind:'bin',x:14,y:12}],player:{x:12,y:12},log:[],deposits:0,stopped:0};}
// ANIMATION: flüchtiger Zustand; Spielstände enthalten nur Simulationsdaten.
const motion=new WeakMap(),staffActors={},footprints=[];let animationTime=0;
const ACTIONS={sell:['Kassieren','#e0bb61',1.15],stock:['Einräumen','#82b99a',1.05],clean:['Reinigen','#9dcbd0',1.1],carry:['Annehmen','#c99e68',1.15],stop:['Ansprechen','#e7a77b',.85],take:['Einpacken','#8ab89e',.7],deposit:['Pfand zählen','#8dc0ad',1]};
function pose(p){let a=motion.get(p);if(!a){a={x:p.x,y:p.y,dir:'down',phase:0,moving:false,action:null,until:0,start:0};motion.set(p,a);}return a;}
function face(p,target){if(!target)return;const a=pose(p),dx=target.x-p.x,dy=target.y-p.y;if(Math.abs(dx)+Math.abs(dy)>.01)a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
function act(p,kind,target){const a=pose(p);face(p,target);a.action=kind;a.start=animationTime;a.until=animationTime+ACTIONS[kind][2];a.moving=false;}
function acting(p){const a=pose(p);return !!a.action&&animationTime<a.until;}
function staffActor(kind){if(!staffActors[kind])staffActors[kind]={x:12,y:13};const p=staffActors[kind],b=layout().shop,sp=storagePoint(),cf=S.furniture.find(f=>f.kind==='checkout'),cp=cf?neighbors(cf)[0]:[12,13],pos={cashier:cp||[12,13],stocker:[sp.x,sp.y-1],cleaner:[b[0]+1,13],security:[13,14]}[kind];p.x=pos[0];p.y=pos[1];return p;}
function animate(dt){if(S.paused||editing()||$('modal').open||document.hidden)return;animationTime+=dt;for(const p of [S.player,...customers,...Object.keys(S.staff).filter(k=>S.staff[k]).map(staffActor)]){const a=pose(p),dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);a.moving=d>.00001&&d<1&&!acting(p);if(a.moving){face(p,{x:p.x+dx,y:p.y+dy});const old=Math.floor(a.phase/Math.PI);a.phase+=d*5;if(Math.floor(a.phase/Math.PI)!==old)footprints.push({x:p.x,y:p.y,t:animationTime});}else if(!acting(p)){a.phase=0;if(p.target)face(p,p.target);}a.x=p.x;a.y=p.y;if(a.action&&animationTime>=a.until)a.action=null;}while(footprints.length&&animationTime-footprints[0].t>.3)footprints.shift();}
let S=fresh(),customers=[],keys={},placing=null,moving=null,moveMode=false,selection=null,last=0,spawn=0,staffTick=0,auto=0,saveNotice=false,editCursor=null,cursorRepeat=0,cursorDirection='';
try{const old=JSON.parse(localStorage.getItem('pokermart-v1'));if(old)S=validate(old);}catch(e){saveNotice=true;}
function validate(o){if(!o||![1,2].includes(o.version)||!Number.isFinite(o.money)||!Array.isArray(o.furniture)||!Array.isArray(o.stock)||o.stock.length!==160||!Array.isArray(o.prices)||o.prices.length!==160)throw Error('Unbekannter Spielstand');const n={...fresh(),...o};if(o.version===1){n.version=2;n.expanded=o.expanded?3:2;}if(!n.prices.every(v=>Number.isFinite(v)&&v>=.01&&v<=999)||!n.stock.every(v=>Number.isFinite(v)&&v>=0&&v<=1e7)||!n.furniture.every(f=>FURN[f.kind]&&Number.isInteger(f.x)&&Number.isInteger(f.y)&&f.x>=3&&f.x<=24&&f.y>=3&&f.y<=15&&(!FURN[f.kind].type||(Number.isInteger(f.pid)&&PRODUCTS[f.pid]?.type===FURN[f.kind].type&&Number.isFinite(f.qty)&&f.qty>=0)))||!Number.isFinite(n.player.x)||!Number.isFinite(n.player.y)||!Number.isFinite(n.time)||!Number.isFinite(n.sales)||!Array.isArray(n.trash)||!Array.isArray(n.orders)||!Array.isArray(n.crates)||!Object.values(n.staff).every(v=>Number.isInteger(v)&&v>=0&&v<=10))throw Error('Beschädigter Spielstand');if(!['day','time','sales','revenue','rating','served','lost','expanded','deposits','stopped'].every(k=>Number.isFinite(n[k])&&n[k]>=0)||!['cashier','stocker','cleaner','security'].every(k=>Number.isInteger(n.staff[k])&&n.staff[k]>=0&&n.staff[k]<=10)||!n.orders.every(o=>Number.isInteger(o.pid)&&PRODUCTS[o.pid]&&Number.isFinite(o.qty)&&o.qty>0&&Number.isFinite(o.eta))||!n.crates.every(o=>Number.isInteger(o.pid)&&PRODUCTS[o.pid]&&Number.isFinite(o.qty)&&o.qty>0)||!n.trash.every(t=>Number.isFinite(t.x)&&Number.isFinite(t.y))||!Array.isArray(n.log)||!n.log.every(l=>typeof l==='string')||n.player.x<3||n.player.x>24||n.player.y<3||n.player.y>16)throw Error('Ungültige Spieldaten');if(!Number.isInteger(n.expanded)||!STAGES[n.expanded])throw Error('Ungültige Ausbaustufe');const l=STAGES[n.expanded],px=Math.round(n.player.x),py=Math.round(n.player.y);if(!inRect(px,py,l.shop)&&!inRect(px,py,l.store)&&!(py===l.door&&px===l.shop[2]+1)&&!(py>=14&&py<=16))n.player={x:12,y:14};if(!o.wallLayout){if(n.expanded===0){for(const [kind,x]of [['shelf',9],['shelf',11],['cold',13]]){const f=n.furniture.find(f=>f.kind===kind&&f.x===x&&f.y===10);if(f&&!n.furniture.some(k=>k.x===x&&k.y===9))f.y=9;}if(n.furniture.some(f=>f.x===Math.round(n.player.x)&&f.y===Math.round(n.player.y)))n.player={x:12,y:13};}n.wallLayout=1;}n.paused=false;n.open=false;return repairCabinetLayout(n);}
function save(){try{const snap={...S,stock:[...S.stock]};for(const c of customers)if(c.state!=='leave')for(const id of c.cart)snap.stock[id]++;localStorage.setItem('pokermart-v1',JSON.stringify(snap));return true;}catch{toast('Speicherung fehlgeschlagen. Bitte exportiere deinen Spielstand.');return false;}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',3800);$('ticker').textContent=s;}
function record(s){S.log.unshift('Tag '+S.day+': '+s);S.log=S.log.slice(0,30);}
function unlocked(p){return S.sales>=p.unlock;}
// WELT: begehbare Räume, Kollisionsprüfung und Pfadsuche.
function floor(x,y,state=S){const l=STAGES[state.expanded];return inRect(x,y,l.shop)||inRect(x,y,l.store)||(y===l.door&&x===l.shop[2]+1)||(y>=14&&y<=16&&x>=3&&x<=24);}
// Sichtbare Wandgrenzen stimmen mit Kollision und Pfadsuche überein.
function canCross(x,y,nx,ny,state=S){if(x===nx&&y===ny)return true;const l=STAGES[state.expanded],area=(a,b)=>inRect(a,b,l.shop)?'shop':inRect(a,b,l.store)?'store':a===l.shop[2]+1&&b===l.door?'hall':'outside',from=area(x,y),to=area(nx,ny);if(from===to)return true;if(from==='hall'||to==='hall')return from!=='outside'&&to!=='outside';if((from==='shop'&&to==='outside')||(from==='outside'&&to==='shop'))return y!==ny&&(x===12||x===13)&&x===nx&&Math.min(y,ny)===13;return false;}
function wallFixture(kind){return !!FURN[kind]?.type||kind==='deposit';}
function furnitureBounds(f,state=S){const top=STAGES[state.expanded].shop[1],wall=wallFixture(f.kind)&&f.y<=top+1;return{left:f.x-.065,right:f.x+1.065,top:wall?top:f.y+.08,bottom:f.y+.93};}
// Die Figur kollidiert über ihre Füße, nicht über das gerundete Feld des Sprite-Ursprungs.
function footBlocked(x,y,state=S){const cx=x+.5,cy=y+.70,rx=.27,ry=.16,gx=Math.floor(cx),gy=Math.floor(cy);for(const [dx,dy]of [[0,0],[-rx,-ry],[rx,-ry],[-rx,ry],[rx,ry]]){const tx=Math.floor(cx+dx),ty=Math.floor(cy+dy);if(!floor(tx,ty,state)||!canCross(gx,gy,tx,ty,state))return true;}for(const f of state.furniture){const b=furnitureBounds(f,state);if(cx+rx>b.left&&cx-rx<b.right&&cy+ry>b.top&&cy-ry<b.bottom)return true;}return false;}
function canMove(fromX,fromY,x,y){return !footBlocked(x,y)&&canCross(Math.floor(fromX+.5),Math.floor(fromY+.7),Math.floor(x+.5),Math.floor(y+.7));}
function solid(x,y){return footBlocked(x,y);}
function repairCabinetLayout(state){const top=STAGES[state.expanded].shop[1];if(state.wallLayout!==2){for(const f of state.furniture){if(wallFixture(f.kind)&&f.y===top+1&&!state.furniture.some(k=>k!==f&&k.x===f.x&&k.y===top))f.y=top;}state.wallLayout=2;}if(footBlocked(state.player.x,state.player.y,state)){const candidates=[];for(let y=3;y<=16;y++)for(let x=3;x<=24;x++)if(!footBlocked(x,y,state))candidates.push({x,y});candidates.sort((a,b)=>distance(a,state.player)-distance(b,state.player));if(candidates.length)state.player=candidates[0];}return state;}

function path(sx,sy,tx,ty){sx=Math.round(sx);sy=Math.round(sy);tx=Math.round(tx);ty=Math.round(ty);let q=[[sx,sy]],seen=new Set([sx+','+sy]),prev=new Map();for(let k=0;k<q.length;k++){const [x,y]=q[k];if(x===tx&&y===ty){let p=[],cur=[x,y];while(cur[0]!==sx||cur[1]!==sy){p.unshift(cur);cur=prev.get(cur.join(','));if(!cur)return [];}return p;}for(const [dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy,key=nx+','+ny;if(!seen.has(key)&&!solid(nx,ny)&&canCross(x,y,nx,ny)){seen.add(key);prev.set(key,[x,y]);q.push([nx,ny]);}}}return [];}
function neighbors(f){return [[f.x,f.y+1],[f.x-1,f.y],[f.x+1,f.y],[f.x,f.y-1]].filter(([x,y])=>!solid(x,y));}
function route(c,f){for(const [x,y] of neighbors(f)){const p=path(c.x,c.y,x,y);if(p.length||Math.hypot(c.x-x,c.y-y)<.4){c.path=p;c.target=f;return true;}}return false;}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function leave(c,happy){c.state='leave';c.path=path(c.x,c.y,12,16);c.target=null;S.rating=Math.max(10,Math.min(100,S.rating+(happy?.5:-1.8)));if(!happy)S.lost++;}
function purchase(c){if(c.state!=='queue')return;act(c,'sell',c.target);const clerk=c.target?.kind==='self'?null:S.staff.cashier?staffActor('cashier'):S.player;if(clerk)act(clerk,'sell',c.target);let v=c.cart.reduce((s,i)=>s+S.prices[i],0);S.money+=v;S.revenue+=v;S.sales+=c.cart.length;S.served++;record(c.profile+' kauft für '+money(v)+' ('+c.payment+').');toast(c.payment+' · '+money(v)+' kassiert');leave(c,true);save();}
function addCustomer(){const profile=Math.floor(Math.random()*20);let c={x:12,y:16,profile:PROFILES[profile],look:profile%12,state:'shop',path:[],target:null,cart:[],payment:Math.random()<.5?'Bar':'EC',patience:65+(profile%6)*9,bubble:'',think:0,wants:1+profile%3,thief:Math.random()<.055};let available=S.furniture.filter(f=>FURN[f.kind].type&&f.qty>0);if(!available.length){c.bubble='Keine Ware!';leave(c,false);}else if(!route(c,rand(available)))leave(c,false);customers.push(c);}
function queue(c){const checkouts=S.furniture.filter(f=>f.kind==='checkout'||f.kind==='self');c.state='queue';if(!checkouts.length){leave(c,false);return;}let sorted=checkouts.map(f=>({f,n:customers.filter(k=>k.state==='queue'&&k.target===f).length})).sort((a,b)=>a.n-b.n);if(!route(c,sorted[0].f))leave(c,false);c.bubble=c.payment==='Bar'?'Bar bitte':'Mit Karte';c.think=0;}
function refill(f,actor=S.player){let n=Math.min(24-f.qty,S.stock[f.pid]);if(n<=0)return false;S.stock[f.pid]-=n;f.qty+=n;act(actor,'stock',f);return true;}
// SIMULATION: Kunden, Lieferketten, Personal, Kosten und Ereignisse.
function update(dt){if(S.paused||editing()||$('modal').open)return;S.time+=dt;spawn+=dt;auto+=dt;staffTick+=dt;for(const o of S.orders)o.eta-=dt;let arrived=S.orders.filter(o=>o.eta<=0);for(const o of arrived){S.crates.push({pid:o.pid,qty:o.qty});toast('Lieferung angekommen! Im Lager mit A / E annehmen.');}S.orders=S.orders.filter(o=>o.eta>0);
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if((dx||dy)&&!acting(S.player)){face(S.player,{x:S.player.x+dx,y:S.player.y+dy});let d=Math.hypot(dx,dy),nx=S.player.x+dx/d*dt*4,ny=S.player.y+dy/d*dt*4;if(canMove(S.player.x,S.player.y,nx,S.player.y))S.player.x=nx;if(canMove(S.player.x,S.player.y,S.player.x,ny))S.player.y=ny;}
if(S.open&&spawn>6&&customers.length<[5,9,14,18][S.expanded]){spawn=0;addCustomer();}
for(const c of customers){c.patience-=dt;if(c.state!=='leave'&&c.patience<=0){c.bubble='Zu lange!';leave(c,false);}if(c.path.length){if(acting(c))continue;let p=c.path[0],d=Math.hypot(p[0]-c.x,p[1]-c.y),step=dt*1.9;if(d<=step){c.x=p[0];c.y=p[1];c.path.shift();}else{c.x+=(p[0]-c.x)/d*step;c.y+=(p[1]-c.y)/d*step;}continue;}c.think+=dt;
if(c.state==='shop'&&c.think>1.2){c.think=0;let f=c.target;if(f&&f.qty>0){const p=PRODUCTS[f.pid],tolerance=1.55+(PROFILES.indexOf(c.profile)%7)*.18;if(S.prices[p.id]/p.cost>tolerance){c.bubble='Zu teuer!';if(!c.cart.length){leave(c,false);continue;}}else if(Math.random()<S.trash.length*.025){c.bubble='Hier ist es schmutzig!';leave(c,false);continue;}else{f.qty--;c.cart.push(p.id);act(c,'take',f);c.bubble='✓ '+p.name.split(' ·')[0];}}
if(c.cart.length>=c.wants||Math.random()<.25){if(c.cart.length){if(c.thief){c.bubble='…';c.state='steal';c.path=path(c.x,c.y,12,16);}else queue(c);}else leave(c,false);}else{let a=S.furniture.filter(f=>FURN[f.kind].type&&f.qty>0);if(!a.length||!route(c,rand(a))){if(c.cart.length)queue(c);else leave(c,false);}}}
if(c.state==='queue'){let first=customers.find(k=>k.state==='queue'&&k.target===c.target&&!k.path.length);if(first===c&&(c.target.kind==='self'||S.staff.cashier)&&c.think>(c.target.kind==='self'?5:3))purchase(c);}
if(c.state==='steal'&&distance(c,{x:12,y:16})<.3){S.rating=Math.max(10,S.rating-1);S.lost++;toast('Diebstahl! Ware verloren. Sicherheit einstellen oder mit E ansprechen.');c.done=true;}
if(c.state==='leave'&&distance(c,{x:12,y:16})<.3){c.done=true;if(S.furniture.some(f=>f.kind==='deposit'))S.deposits+=1+Math.floor(Math.random()*3);if(Math.random()<.25)S.trash.push({x:layout().shop[0]+Math.floor(Math.random()*(layout().shop[2]-layout().shop[0]+1)),y:13});}}
customers=customers.filter(c=>!c.done);
if(staffTick>3){staffTick=0;if(S.staff.stocker){for(let i=0;i<S.staff.stocker;i++){if(S.crates.length){const c=S.crates.shift();S.stock[c.pid]+=c.qty;act(staffActor('stocker'),'carry',storagePoint());}else{const f=S.furniture.find(f=>FURN[f.kind].type&&f.qty<16&&S.stock[f.pid]>0);if(f)refill(f,staffActor('stocker'));}}}if(S.staff.cleaner&&S.trash.length){act(staffActor('cleaner'),'clean',S.trash[0]);S.trash.splice(0,S.staff.cleaner);}if(S.staff.security){const c=customers.find(c=>c.state==='steal');if(c){act(staffActor('security'),'stop',c);c.thief=false;S.stopped++;queue(c);toast('Sicherheit hat einen Diebstahl verhindert.');}}}
if(S.time>=240){S.time-=240;S.day++;let wages=Object.values(S.staff).reduce((a,b)=>a+b,0)*85,utilities=[12,22,35,50][S.expanded]+S.furniture.filter(f=>['cold','frozen','self'].includes(f.kind)).length*5;S.money-=wages+utilities;record('Tageskosten '+money(wages+utilities));toast('Tag '+S.day+' · Personal & Betrieb: '+money(wages+utilities));}
if(auto>12){auto=0;save();}hud();}
function interact(){if($('modal').open||S.paused||moveMode||acting(S.player))return;let c=customers.find(c=>c.state==='steal'&&distance(S.player,c)<2);if(c){act(S.player,'stop',c);c.thief=false;S.stopped++;queue(c);toast('Angesprochen! Der Kunde geht zur Kasse.');return;}let dirt=S.trash.findIndex(t=>distance(S.player,t)<1.8);if(dirt>=0){act(S.player,'clean',S.trash[dirt]);S.trash.splice(dirt,1);toast('Schmutz beseitigt.');return;}if(S.crates.length&&distance(S.player,storagePoint())<2.3){let c=S.crates.shift();S.stock[c.pid]+=c.qty;act(S.player,'carry',storagePoint());toast(c.qty+' × '+PRODUCTS[c.pid].name+' eingelagert.');return;}const f=S.furniture.filter(f=>distance(S.player,f)<2.05).sort((a,b)=>distance(S.player,a)-distance(S.player,b))[0];if(!f){toast('Nähere dich einem Möbel, einer Lieferung oder Schmutz.');return;}if(f.kind==='checkout'){c=customers.find(c=>c.state==='queue'&&c.target===f&&!c.path.length);if(c){selection=c;checkoutPanel(c);}else toast('Hier wartet gerade niemand.');}else if(FURN[f.kind].type){selection=f;shelfPanel(f);}else if(f.kind==='deposit'){const n=Math.min(10,S.deposits);if(!n){toast('Noch keine Pfandrückgaben. Kunden bringen Flaschen nach ihrem Einkauf zurück.');return;}act(S.player,'deposit',f);S.money+=n*.25;S.deposits-=n;toast('Pfandservice: '+money(n*.25)+' Bearbeitungsbonus.');f.used=S.time;}else if(f.kind==='bin'){if(S.trash.length){act(S.player,'clean',f);S.trash.shift();toast('Abfall entsorgt.');}else toast('Alles sauber.');}else toast('Ein bisschen Grün macht den Laden gemütlicher.');}
function checkoutPanel(c){show('Verkauf · '+c.profile,`<p class="sub">${c.cart.map(i=>PRODUCTS[i].name).join(' · ')}</p><div class="big">${money(c.cart.reduce((a,i)=>a+S.prices[i],0))}</div><p>Gewünschte Zahlungsart: <b>${c.payment==='Bar'?'Bargeld':'EC-Karte'}</b></p>${c.payment==='Bar'?'<p class="sub">Nimm den Betrag an und gib das Wechselgeld heraus.</p><button class="primary" onclick="cashStep()">Bargeld annehmen</button>':'<p class="sub">Starte das Terminal. Danach kannst du die Zahlung bestätigen.</p><button class="primary" onclick="cardStep()">EC-Terminal starten</button>'}`);}
function cashStep(){const total=selection.cart.reduce((a,i)=>a+S.prices[i],0),given=Math.ceil(total/10)*10;show('Bargeld · Wechselgeld',`<p>Erhalten: <b>${money(given)}</b> · Einkauf: <b>${money(total)}</b></p><p>Wie viel Wechselgeld gibst du zurück?</p><div class="row">${[given-total, given-total+1, Math.max(0,given-total-1)].sort(()=>Math.random()-.5).map(v=>`<button onclick="finishCash(${v},${given-total})">${money(v)}</button>`).join('')}</div>`);}
function finishCash(v,right){if(Math.abs(v-right)>.001){toast('Prüfe das Wechselgeld noch einmal.');return;}purchase(selection);closePanel();}
function cardStep(){show('EC-Zahlung',`<div class="notice">Terminal bereit · Kontaktlos oder Karte einstecken</div><p>Der Kunde hat seine Zahlung freigegeben.</p><button class="primary" onclick="purchase(selection);closePanel()">Zahlung bestätigen</button>`);}
function shelfPanel(f){show(FURN[f.kind].name,`<p>Auslage: <b>${PRODUCTS[f.pid].name}</b> · ${f.qty}/24 Stück<br>Lager: ${S.stock[f.pid]} Stück</p><button class="primary" onclick="fillAndClose()">Aus Lager auffüllen</button><hr><p>Produkt zuordnen (vorhandene Ware geht ins Lager zurück):</p><select id="assign">${PRODUCTS.filter(p=>p.type===FURN[f.kind].type&&unlocked(p)).map(p=>`<option value="${p.id}" ${p.id===f.pid?'selected':''}>${p.name}</option>`).join('')}</select> <button onclick="assignShelf()">Zuordnen</button><hr><button onclick="beginMove(selection)">↔ Möbel verschieben</button> <button onclick="removeFurniture()">Möbel verkaufen · ${money(FURN[f.kind].cost*.5)}</button>`);}
function fillAndClose(){const success=refill(selection);closePanel();toast(success?'Ware wird eingeräumt.':'Keine passende Ware im Lager oder Möbel bereits voll.');}
function assignShelf(){let f=selection;S.stock[f.pid]+=f.qty;f.qty=0;f.pid=+$('assign').value;refill(f);closePanel();toast('Produkt zugeordnet.');}
function removeFurniture(){S.stock[selection.pid]+=selection.qty;S.money+=FURN[selection.kind].cost*.5;S.furniture=S.furniture.filter(f=>f!==selection);closePanel();}
// OBERFLÄCHE: einkaufen, planen, Personal und Spielstände.
function editing(){return !!placing||moveMode;}
function show(t,h){$('title').textContent=t;$('body').innerHTML=h;if(!$('modal').open)$('modal').showModal();keys={};}
function closePanel(){$('modal').close();keys={};hud();}
function panel(name){if(name==='menu'){show('Pokermart · Spielmenü',`<div class="notice">${editing()?'Möbelmodus aktiv · Menü schließen, um den Cursor weiterzubewegen.':'WASD / Steuerkreuz: laufen · A / E: interagieren · Q: Menü'}</div><div class="game-menu"><button id="openBtn" onclick="S.open=!S.open;hud();panel('menu')">${S.open?'● Laden schließen':'○ Laden öffnen'}<small>Kunden empfangen oder Einlass stoppen</small></button><button id="pauseBtn" onclick="S.paused=!S.paused;hud();panel('menu')">${S.paused?'▶ Fortsetzen':'Ⅱ Pause'}<small>Simulation anhalten oder fortsetzen</small></button><button onclick="panel('supply')">▣ Einkauf & Import<small>Neue Ware und Lieferungen</small></button><button onclick="panel('products')">€ Sortiment & Preise<small>Verkaufspreise festlegen</small></button><button onclick="panel('build')">▦ Möbel kaufen & Ausbau<small>WASD setzt den Möbelcursor</small></button><button id="moveBtn" onclick="startMoveMode()">↔ Möbel verschieben<small>WASD wählen · A aufnehmen und abstellen</small></button><button onclick="panel('staff')">♙ Mitarbeitende<small>Personal einstellen und verwalten</small></button><button onclick="panel('goals')">✧ Erfolge<small>Weitere Produkte freischalten</small></button><button onclick="panel('manage')">⚙ Management & Spielstand<small>Speichern, Export und Import</small></button><button onclick="panel('help')">? Spielhilfe<small>Steuerung und Abläufe</small></button>${editing()?'<button onclick="backAction();closePanel()">✕ Möbelmodus beenden<small>Ohne Kauf oder Umstellen abbrechen</small></button>':''}</div>`);hud();}else if(name==='supply' ||name==='products'){show(name==='supply'?'Einkauf & Warenimport':'Sortiment & Preisgestaltung',`<div class="row"><input id="search" type="search" placeholder="Produkt suchen …" oninput="productRows('${name}')"><select id="category" onchange="productRows('${name}')"><option value="all">Alle Möbeltypen</option><option value="shelf">Regal</option><option value="cold">Kühlung</option><option value="frozen">Gefriertruhe</option></select><span class="pill">${PRODUCTS.filter(unlocked).length} / 160 freigeschaltet</span></div><div class="notice">${name==='supply'?'Bestellungen kommen nach 15 Sekunden im Lager an. Dort mit A / E annehmen oder eine Lagerkraft einstellen. Importware: 10 % günstiger, 40 Sekunden Lieferzeit.':'Preise beeinflussen die Kaufentscheidung. Ein Aufschlag von 55–80 % ist für viele Kunden attraktiv. Ware muss zum Möbel passen.'}</div><div style="overflow:auto"><table><thead><tr><th>Produkt</th><th>EK</th><th>Lager</th><th>${name==='supply'?'Bestellen':'VK / Stück'}</th></tr></thead><tbody id="productRows"></tbody></table></div>`);productRows(name);}
else if(name==='build'){show('Möbel & Ladenausbau',`<button onclick="startMoveMode()">↔ Vorhandene Möbel kostenlos verschieben</button><p class="sub">Regale und Kühlschränke können direkt in der obersten Bodenreihe bündig an die Rückwand gesetzt werden. Möbel auswählen, mit WASD / Steuerkreuz ein freies Feld wählen und A / E drücken. B / Escape bricht ab. Laufwege und der Zugang zu allen Möbeln bleiben frei.</p><div class="cards">${Object.entries(FURN).map(([k,f])=>`<div class="card"><h3>${f.name}</h3><p>${f.type?'24 Plätze · nur '+({shelf:'Trockenware',cold:'Kühlprodukte',frozen:'Tiefkühlprodukte'}[f.type]):k==='self'?'Bedient Kunden selbstständig.':k==='checkout'?'Manuell mit E oder durch Kassenpersonal.':k==='deposit'?'Kunden geben Flaschen zurück. Pfandservice per E abrechnen.':k==='bin'?'Abfälle mit E entsorgen.':'Dekoration für deinen Shop.'}</p><button ${S.money<f.cost?'disabled':''} onclick="startBuild('${k}')">${money(f.cost)} · Platzieren</button></div>`).join('')}<div class="card"><h3>${layout().name} · Stufe ${S.expanded+1}/4</h3><p>Verkaufsfläche: ${(layout().shop[2]-layout().shop[0]+1)*(layout().shop[3]-layout().shop[1]+1)} Felder.<br>${STAGES[S.expanded+1]?'Nächster Ausbau: '+STAGES[S.expanded+1].name+'. Zusätzliche Fläche und größeres Lager; vorhandene Möbel bleiben stehen.':'Maximale Ladengröße erreicht.'}</p><button ${!STAGES[S.expanded+1]||S.money<STAGES[S.expanded+1].cost?'disabled':''} onclick="expand()">${STAGES[S.expanded+1]?money(STAGES[S.expanded+1].cost)+' · Ausbauen':'Vollständig ausgebaut'}</button></div></div>`);}
else if(name==='staff'){show('Dein Team',`<p class="sub">Personal arbeitet automatisch. Lohn: 85 € pro Person und Spieltag (4 Minuten). Entlassungen sind jederzeit möglich.</p><div class="cards">${Object.entries({cashier:['Kassenkraft','Bedient die normale Kasse.'],stocker:['Lagerkraft','Nimmt Lieferungen an und füllt Auslagen auf.'],cleaner:['Reinigungskraft','Entfernt regelmäßig Schmutz.'],security:['Sicherheit','Stoppt flüchtende Ladendiebe.']}).map(([k,a])=>`<div class="card"><h3>${a[0]} · ${S.staff[k]}</h3><p>${a[1]}</p><button onclick="hire('${k}')" ${S.money<150||S.staff[k]>=10?'disabled':''}>Einstellen · 150 €</button> <button ${!S.staff[k]?'disabled':''} onclick="S.staff['${k}']--;panel('staff')">−</button></div>`).join('')}</div>`);}
else if(name==='goals'){show('Erfolge & neue Sortimente',`<p class="sub">10 Startprodukte. Je 12 verkaufte Artikel schaltest du zehn weitere Produkte frei. Insgesamt 160 Artikel.</p><div class="cards">${Array.from({length:16},(_,i)=>`<div class="card"><h3>${S.sales>=i*12?'✓':'◇'} ${i===0?'Grundsortiment':'Sortimentsstufe '+i}</h3><p>${i*12} Verkäufe · ${i===0?'Startprodukte':VARIANTS[i]+'-Sortiment'}</p><progress value="${Math.min(S.sales,i*12)||1}" max="${i*12||1}" style="width:100%;accent-color:#237562"></progress></div>`).join('')}</div>`);}
else if(name==='manage'){show('Shop-Management & Spielstand',`<div class="cards"><div class="card"><h3>Dein Geschäft</h3><p>Umsatz: ${money(S.revenue)}<br>Bediente Kunden: ${S.served}<br>Unzufrieden / Diebstahl: ${S.lost}<br>Diebstähle verhindert: ${S.stopped}<br>Schmutzstellen: ${S.trash.length}<br>Lieferungen unterwegs: ${S.orders.length}<br>Kartons im Lager: ${S.crates.length}</p></div><div class="card"><h3>Speicherstand</h3><p>Automatische lokale Speicherung alle 12 Sekunden. Export sichert deinen Fortschritt als JSON-Datei.</p><button onclick="if(save())toast('Gespeichert.')">Speichern</button> <button onclick="exportSave()">Export</button> <button onclick="document.getElementById('loadFile').click()">Import</button><p><button onclick="resetPanel()">Neues Spiel …</button></p></div></div><h3>Shop-Chronik</h3><div id="logs"></div>`);$('logs').textContent=S.log.join('\n');$('logs').style.whiteSpace='pre-line';}
else if(name==='help'){show('Willkommen in deinem Pokermart',`<p class="sub">Ein kleiner Laden. Große Pläne. Starte mit 2.600 €, einem Kiosk mit 35 Verkaufsfeldern, zwei Regalen, einer Getränkekühlung und einer Kasse. Zehn Produkte stehen im Einkauf zur Verfügung. Weitere Möbel kaufst du selbst.</p><div class="cards"><div class="card"><h3>1 · Türen öffnen</h3><p>Unten mittig MENÜ öffnen und „Laden öffnen“ wählen. 20 Kundenprofile haben unterschiedliche Preisgrenzen, Einkaufsgrößen und Geduld. Über den Köpfen siehst du Wünsche und Reaktionen.</p></div><div class="card"><h3>2 · Verkaufen</h3><p>Mit Steuerkreuz oder WASD zur Kasse im Kiosk laufen. A / E startet den Verkauf. Bargeld erfordert korrektes Wechselgeld, EC eine Bestätigung.</p></div><div class="card"><h3>3 · Ware nachlegen</h3><p>Mit A / E am Möbel auffüllen oder Produkt wechseln. Einkauf bestellt neue Ware. Das Lager ist rechts: am Kartonstapel mit A / E annehmen.</p></div><div class="card"><h3>4 · Wachsen</h3><p>Vom Kiosk über Nachbarschaftsladen und Mini-Markt zum Supermarkt wachsen. Ausbau kostet 1.800 €, 4.500 € und 9.000 €. Im unteren Menü Möbel kaufen oder verschieben wählen. WASD / Steuerkreuz bewegt den Cursor; A / E nimmt Möbel auf und stellt sie ab. B / Escape bricht ab. Mitarbeiter automatisieren Aufgaben. Kunden hinterlassen Schmutz; Diebe mit A / E ansprechen. Pfandautomaten und SB-Kassen ergänzen den Laden.</p></div></div><p class="sub">Alle Menüs pausieren die Simulation. Links bewegt das Steuerkreuz Figur oder Möbelcursor, rechts bestätigt A. Unten mittig öffnet MENÜ alle Shop-Funktionen. Escape beendet einen Bauauftrag. Ein Spieltag dauert vier Minuten. Speichern geschieht lokal; ohne geöffnetes Spiel vergeht keine Zeit.</p><button class="primary" onclick="closePanel()">Loslegen</button>`);}}
function productRows(mode){let term=$('search').value.toLowerCase(),type=$('category').value;const rows=PRODUCTS.filter(p=>unlocked(p)&&p.name.toLowerCase().includes(term)&&(type==='all'||p.type===type));$('productRows').innerHTML=rows.map(p=>`<tr><td><b>${p.name}</b><br><span class="sub">${{shelf:'Regal',cold:'Kühlung',frozen:'Gefriertruhe'}[p.type]}</span></td><td>${money(p.cost)}</td><td>${S.stock[p.id]}</td><td>${mode==='supply'?`<button onclick="order(${p.id},false)">12 × · ${money(p.cost*12)}</button> <button onclick="order(${p.id},true)">Import · ${money(p.cost*12*.9)}</button>`:`<input aria-label="Preis ${p.name}" type="number" min="0.01" max="999" step="0.05" value="${S.prices[p.id]}" onchange="setPrice(${p.id},this)">`}</td></tr>`).join('');}
function setPrice(id,input){const v=+input.value;if(!Number.isFinite(v)||v<.01||v>999){input.value=S.prices[id];toast('Preis muss zwischen 0,01 € und 999 € liegen.');return;}S.prices[id]=Math.round(v*100)/100;}
function order(id,imported){const p=PRODUCTS[id];if(!unlocked(p))return;const cost=p.cost*12*(imported?.9:1);if(S.money<cost){toast('Nicht genug Geld.');return;}S.money-=cost;S.orders.push({pid:id,qty:12,eta:imported?40:15});toast('12 × '+p.name+' bestellt · '+(imported?'40':'15')+' Sekunden Lieferzeit nach Schließen des Menüs.');hud();}
function hire(k){if(S.money<150||S.staff[k]>=10)return;S.money-=150;S.staff[k]++;panel('staff');hud();}
function expand(){const next=STAGES[S.expanded+1];if(!next||S.money<next.cost)return;const oldStore=layout().store,wasInStore=inRect(Math.round(S.player.x),Math.round(S.player.y),oldStore)||Math.round(S.player.x)===layout().shop[2]+1;S.money-=next.cost;const oldBack=layout().shop[1];for(const f of S.furniture)if(FURN[f.kind].type&&f.y===oldBack)f.y=next.shop[1];S.expanded++;if(wasInStore)S.player=storagePoint();for(const c of customers){if(c.target)route(c,c.target);else c.path=path(c.x,c.y,12,16);}record('Ausbau zum '+next.name+' für '+money(next.cost));closePanel();save();toast(next.name+' eröffnet · mehr Verkaufsfläche verfügbar!');}
function startBuild(k){cancelMove(false);placing=k;setEditCursor({x:Math.round(S.player.x),y:wallFixture(k)?layout().shop[1]:Math.round(S.player.y)});closePanel();toast(FURN[k].name+': WASD / Steuerkreuz platzieren · A / E bestätigen.');}
function exportSave(){const a=document.createElement('a');const snap={...S,stock:[...S.stock]};for(const c of customers)if(c.state!=='leave')for(const id of c.cart)snap.stock[id]++;a.href=URL.createObjectURL(new Blob([JSON.stringify(snap)],{type:'application/json'}));a.download='Pokermart-Spielstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function resetPanel(){show('Neues Spiel?',`<p>Der aktuelle lokale Spielstand wird ersetzt. Exportiere ihn vorher, wenn du ihn behalten möchtest.</p><button onclick="exportSave()">Exportieren</button> <button class="primary" onclick="S=fresh();customers=[];placing=null;moving=null;moveMode=false;editCursor=null;spawn=0;save();closePanel()">Neues Spiel starten</button>`);}
$('loadFile').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error('Datei zu groß');const loaded=validate(JSON.parse(await f.text()));S=loaded;customers=[];placing=null;moving=null;moveMode=false;editCursor=null;spawn=0;save();closePanel();toast('Spielstand importiert.');}catch(err){toast('Import fehlgeschlagen: '+err.message);}e.target.value='';});
function hud(){$('worldtag').textContent=layout().name.toUpperCase()+' · '+(S.open?'GEÖFFNET':'GESCHLOSSEN')+' · AUSBAU '+(S.expanded+1)+'/4';$('money').textContent=money(S.money);const mins=Math.floor(S.time/240*720)+480;$('clock').textContent=S.day+' · '+String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');$('rating').textContent=Math.round(S.rating)+' %';$('sales').textContent=S.sales;if($('moveBtn'))$('moveBtn').classList.toggle('active',moveMode);$('actionLabel').textContent=placing?'Platzieren':moving?'Abstellen':moveMode?'Auswählen':'Interaktion';$('interact').setAttribute('aria-label',$('actionLabel').textContent+' · A oder E');$('hint').textContent=editing()?(moveMode&&!moving?'MÖBEL WÄHLEN · WASD / Kreuz · A aufnehmen · B abbrechen':(moving?'VERSCHIEBEN':'BAUEN')+' · '+FURN[moving?.kind||placing].name+' · WASD / Kreuz · A bestätigen · B abbrechen'):(S.paused?'PAUSE · Im Menü fortsetzen':S.crates.length?'▣ '+S.crates.length+' Lieferung(en) · A im Lager':customers.some(c=>c.state==='queue')?'Kunden warten · A an der Kasse':'WASD / Kreuz bewegen · A interagieren · Menü unten');}

function drawFrontWalls(b,st){for(const [box,store]of [[b,false],[st,true]]){const x=OX+box[0]*T,y=OY+(box[3]+1)*T,w=(box[2]-box[0]+1)*T;function front(fx,fw){if(fw<=0)return;rect(fx,y-9,fw,13,'#779489');rect(fx,y-12,fw,4,'#bdcdbb');rect(fx,y+4,fw,3,'#47675b');}if(store)front(x-12,w+24);else{const doorX=OX+12*T;front(x-12,doorX-x+12);front(doorX+2*T,x+w+12-doorX-2*T);rect(doorX-5,y-21,5,26,'#52796c');rect(doorX+2*T,y-21,5,26,'#52796c');}}}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);rect(0,0,1250,800,'#92ae85');for(let i=0;i<30;i++){rect((i*193)%1240,(i*97)%790,3,3,'#7c9f72');}rect(0,675,1250,125,'#c4cbc5');rect(0,752,1250,48,'#7f9090');for(let x=30;x<1250;x+=130)rect(x,774,60,3,'#d9dfcf');
const l=layout(),b=l.shop,st=l.store,sp=storagePoint();
// Die Ausbaufläche bleibt als Wiese sichtbar, bis sie gekauft wird.
for(let y=b[1];y<=b[3];y++)for(let x=b[0];x<=b[2];x++){rect(OX+x*T,OY+y*T,T,T,(x+y)%2?'#eeeee1':'#e9ecdf');rect(OX+x*T,OY+y*T,T,1,'#dfe4d8');rect(OX+x*T,OY+y*T,1,T,'#dfe4d8');}
for(let y=st[1];y<=st[3];y++)for(let x=st[0];x<=st[2];x++)rect(OX+x*T,OY+y*T,T,T,(x+y)%2?'#d8dfd0':'#d2dbca');rect(OX+(b[2]+1)*T,OY+l.door*T,T,T,'#dce2d5');
drawRoomWalls(b,l.door,false);drawRoomWalls(st,l.door,true);
textAt(S.expanded===0?'POKERMART · KIOSK':'POKERMART',OX+(b[0]+b[2]+1)/2*T,OY+b[1]*T-86,'#f9fff2',S.expanded===0?18:23);textAt('LAGER',OX+(st[0]+st[2]+1)/2*T,OY+st[1]*T-67,'#304d40',12);textAt('EINGANG',OX+13*T,OY+14.3*T,'#426352',10);sprite([89,224,93,32],OX+12*T,OY+13.7*T,92,30);
if(!S.expanded){textAt('DEIN LADEN KANN WACHSEN',OX+10*T,OY+4*T,'#496e4d',16);textAt('Möbel & Ausbau → nächste Stufe: 1.800 €',OX+10*T,OY+4*T+25,'#587855',12);}
const entities=S.furniture.map(f=>({y:f.y+.93,draw:()=>{let x=OX+f.x*T,y=OY+f.y*T,def=FURN[f.kind];if(def.type&&f.y===b[1]){rect(x-3,y-29,T+6,8,'#223f3c36');rect(x-2,y+23,T+4,17,'#354d4226');}rect(x+3,y+23,T-2,18,'#53695422');if(def.sprite){sprite(def.sprite,x-3,y-25,T+6,T+17);}else{rect(x+10,y-3,27,40,'#58756c');rect(x+7,y-5,33,7,'#3b5953');textAt('♻',x+23,y+22,'#d7e5ce',20);}if(def.type){rect(x-2,y+39,50,13,'#fffffff0');textAt(f.qty+' · '+PRODUCTS[f.pid].name.slice(0,7),x+23,y+49,'#4f6358',8);rect(x,y+34,T,3,'#d5dacd');rect(x,y+34,T*f.qty/24,3,f.qty?'#70a286':'#ce765e');}}}));
for(const f of footprints){ctx.globalAlpha=Math.max(0,1-(animationTime-f.t)/.3)*.2;textAt('·',OX+f.x*T+23,OY+f.y*T+40,'#8b9f81',23);ctx.globalAlpha=1;}
for(const t of S.trash)entities.push({y:t.y,draw:()=>{textAt('✦',OX+t.x*T+20,OY+t.y*T+25,'#9a7853',24);}});for(const c of customers)entities.push({y:c.y+.7,draw:()=>person(c,c.look)});entities.push({y:S.player.y+.7,draw:()=>person(S.player,0,true)});
for(const [k,n]of Object.entries(S.staff)){if(!n)continue;const p=staffActor(k);entities.push({y:p.y+.7,draw:()=>person(p,k==='security'?7:1)});}
entities.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());if(S.crates.length){for(let i=0;i<Math.min(6,S.crates.length);i++){let x=OX+(sp.x-.5)*T+(i%2)*30,y=OY+sp.y*T-Math.floor(i/2)*17;rect(x,y,28,25,'#bc945c');rect(x+12,y,4,25,'#e1c293');}textAt(S.crates.length+' Kartons · E',OX+(sp.x+.5)*T,OY+(sp.y+1)*T+26,'#4e6249',11);}else textAt('Lieferannahme',OX+(sp.x+.5)*T,OY+sp.y*T+20,'#6b7c69',11);
drawFrontWalls(b,st);
if(moveMode){for(const f of S.furniture){ctx.strokeStyle=f===moving?'#e5ad4d':'#579e89';ctx.lineWidth=f===moving?3:1;ctx.strokeRect(OX+f.x*T-3,OY+f.y*T-27,T+6,T+66);}if(moving&&hover){const def=FURN[moving.kind],x=OX+hover.x*T,y=OY+hover.y*T;ctx.globalAlpha=.55;if(def.sprite)sprite(def.sprite,x-3,y-25,T+6,T+17);else rect(x+10,y-3,27,40,'#58756c');ctx.globalAlpha=1;}}
if(placing&&hover){const def=FURN[placing];if(def.sprite){ctx.globalAlpha=.55;sprite(def.sprite,OX+hover.x*T-3,OY+hover.y*T-25,T+6,T+17);ctx.globalAlpha=1;}}
if(editing()&&hover){ctx.strokeStyle='#f0c86f';ctx.lineWidth=3;ctx.strokeRect(OX+hover.x*T+1,OY+hover.y*T+1,T-2,T-2);ctx.globalAlpha=.4;rect(OX+hover.x*T,OY+hover.y*T,T,T,(moveMode&&!moving?S.furniture.some(f=>f.x===hover.x&&f.y===hover.y):canPlace(hover.x,hover.y))?'#3c9c72':'#ce6b58');ctx.globalAlpha=1;if(FURN[moving?.kind||placing]?.type&&hover.y===b[1])textAt('AN DER RÜCKWAND',OX+hover.x*T+23,OY+hover.y*T-38,'#355e50',10);}if(S.paused){rect(0,0,1250,800,'#193e3333');textAt('PAUSE',625,400,'#fff',32);}requestAnimationFrame(draw);}
let hover=null;
function canvasPoint(e){const r=cv.getBoundingClientRect(),scale=Math.min(r.width/cv.width,r.height/cv.height);return{x:(e.clientX-r.left-(r.width-cv.width*scale)/2)/scale,y:(e.clientY-r.top-(r.height-cv.height*scale)/2)/scale};}
function tile(e){const c=canvasPoint(e),p={x:Math.floor((c.x-OX)/T),y:Math.floor((c.y-OY)/T)},b=layout().shop;if((placing||moving)&&wallFixture(moving?.kind||placing)&&p.y>=b[1]-1&&p.y<=b[1]+1&&p.x>=b[0]&&p.x<=b[2])p.y=b[1];return p;}
function setEditCursor(p){const b=layout().shop;editCursor={x:Math.max(b[0],Math.min(b[2],Math.round(p.x))),y:Math.max(b[1],Math.min(12,Math.round(p.y)))};hover={...editCursor};cursorRepeat=0;cursorDirection='';}
function updateControls(dt){if(!editing()||$('modal').open)return;if(!editCursor)setEditCursor(S.player);let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(dx)dy=0;const dir=dx+','+dy;if(!dx&&!dy){cursorDirection='';cursorRepeat=0;return;}cursorRepeat-=dt;if(dir===cursorDirection&&cursorRepeat>0)return;cursorDirection=dir;cursorRepeat=.15;const b=layout().shop;let y=editCursor.y+dy;if((placing||moving)&&wallFixture(moving?.kind||placing)&&y===b[1]+1)y+=dy;editCursor={x:Math.max(b[0],Math.min(b[2],editCursor.x+dx)),y:Math.max(b[1],Math.min(12,y))};hover={...editCursor};hud();}
function primaryAction(){if($('modal').open)return;if(editing()){if(!editCursor)setEditCursor(S.player);handleWorldClick({...editCursor});keys={};if(!editing()){editCursor=null;hover=null;}hud();}else interact();}
function backAction(){if(editing()){placing=null;cancelMove(false);editCursor=null;hover=null;keys={};hud();toast('Möbelmodus beendet.');}else if($('modal').open)closePanel();else panel('menu');}
function startMoveMode(){if(moveMode){cancelMove();return;}placing=null;moving=null;moveMode=true;keys={};const nearest=[...S.furniture].sort((a,b)=>distance(a,S.player)-distance(b,S.player))[0];setEditCursor(nearest||S.player);closePanel();toast('WASD / Steuerkreuz: Möbel wählen · A aufnehmen · B abbrechen.');}
function beginMove(f){if(!S.furniture.includes(f))return;placing=null;moving=f;moveMode=true;keys={};setEditCursor(f);closePanel();toast(FURN[f.kind].name+' · WASD / Kreuz verschieben · A abstellen.');}
function cancelMove(announce=true){const was=moveMode;moving=null;moveMode=false;editCursor=null;hover=null;keys={};hud();if(was&&announce)toast('Verschieben beendet.');}
function canPlace(x,y){const kind=moving?.kind||placing;if(!kind)return false;if(wallFixture(kind)&&y===layout().shop[1]+1)return false;const b=layout().shop;if(x<b[0]||x>b[2]||y<b[1]||y>12||!Number.isInteger(x)||!Number.isInteger(y)||!floor(x,y)||S.furniture.some(f=>f!==moving&&f.x===x&&f.y===y)||distance(S.player,{x,y})<.8||customers.some(c=>distance(c,{x,y})<.8)||(!moving&&S.money<FURN[kind].cost))return false;
const original=S.furniture,candidate={kind,x,y};try{S.furniture=original.filter(f=>f!==moving);S.furniture.push(candidate);for(const obj of [...S.furniture,storagePoint()])if(!neighbors(obj).some(([nx,ny])=>path(12,16,nx,ny).length))return false;for(const actor of [S.player,...customers])if(footBlocked(actor.x,actor.y)||!path(actor.x,actor.y,12,16).length&&distance(actor,{x:12,y:16})>.6)return false;return true;}finally{S.furniture=original;}}
function rerouteCustomers(){for(const c of customers){if(c.target){if(!route(c,c.target))leave(c,false);else if(c.state==='queue')c.think=0;}else c.path=path(c.x,c.y,12,16);}}
function handleWorldClick(p){if(moveMode&&!moving){const f=S.furniture.find(f=>f.x===p.x&&f.y===p.y);if(f)beginMove(f);else toast('Mit WASD / Kreuz ein Möbel wählen und A drücken.');return;}if(!placing&&!moving)return;if(!canPlace(p.x,p.y)){toast(moving?'Dieser Platz ist belegt oder würde einen Laufweg blockieren.':'Feld belegt, Laufweg blockiert oder Geld reicht nicht.');return;}
if(moving){const f=moving;if(f.x===p.x&&f.y===p.y){cancelMove(false);toast('Möbel bleibt an seinem Platz.');return;}f.x=p.x;f.y=p.y;cancelMove(false);rerouteCustomers();record(FURN[f.kind].name+' kostenlos verschoben.');save();hud();toast('Möbel verschoben · Warenbestand und Zuordnung bleiben erhalten.');return;}
const k=placing,f={kind:k,...p};if(FURN[k].type){f.pid=PRODUCTS.find(p=>p.type===FURN[k].type&&unlocked(p)).id;f.qty=0;}S.money-=FURN[k].cost;S.furniture.push(f);placing=null;rerouteCustomers();toast('Möbel gebaut. Mit E interagieren.');save();hud();}
cv.addEventListener('pointermove',e=>{if(editing()){const p=tile(e);setEditCursor(p);}});cv.addEventListener('click',e=>{if(!editing())return;if(moveMode&&!moving){const {x:px,y:py}=canvasPoint(e);const hit=[...S.furniture].sort((a,b)=>b.y-a.y).find(f=>px>=OX+f.x*T-3&&px<=OX+f.x*T+T+3&&py>=OY+f.y*T-25&&py<=OY+f.y*T+40);if(hit){beginMove(hit);return;}}setEditCursor(tile(e));primaryAction();});
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key.length===1?e.key.toLowerCase():e.key;if($('modal').open)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(k))e.preventDefault();keys[k]=true;if(e.repeat)return;if(k==='Escape')backAction();if(k==='e'||k===' '||k==='Enter')primaryAction();if(k==='q')panel('menu');if(k==='b')panel('build');if(k==='m')startMoveMode();});window.addEventListener('keyup',e=>keys[e.key.length===1?e.key.toLowerCase():e.key]=false);window.addEventListener('blur',()=>{keys={};document.querySelectorAll('[data-key]').forEach(b=>b.classList.remove('held'));});document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.key]=true;b.classList.add('held');});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[b.dataset.key]=false;b.classList.remove('held');});});
$('modal').addEventListener('close',()=>keys={});window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{last=0;keys={};if(document.hidden)save();});
function loop(now){const dt=last?Math.min((now-last)/1000,.08):0;last=now;if(!document.hidden){updateControls(dt);update(dt);animate(dt);}requestAnimationFrame(loop);}hud();draw();requestAnimationFrame(loop);if(!localStorage.getItem('pokermart-v1'))panel('help');if(saveNotice)toast('Lokaler Spielstand konnte nicht geladen werden. Neues Spiel gestartet.');
</script></body></html>
